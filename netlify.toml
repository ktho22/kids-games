# Every game is still a plain static folder — "npm install" here exists
# only so the one serverless function (cloud saves) has its dependency
# available to bundle. Nothing about the games themselves gets built.
[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Game files change whenever we ship an update, so always revalidate.
# Netlify sends ETags, so an unchanged game answers 304 and costs nothing.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Unknown paths land back on the game list instead of a bare 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
