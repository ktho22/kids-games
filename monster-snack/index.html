<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a33">
<title>냠냠 우주 몬스터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --font: 'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#0d0a33; color:#fff; font-family:var(--font);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  touch-action:none; overscroll-behavior:none;
}
button { font-family:var(--font); cursor:pointer; }
canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
.hidden { display:none !important; }

.icon-btn {
  width:48px; height:48px; flex:none; border-radius:50%;
  border:2px solid rgba(255,255,255,.28); background:rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  color:#fff; font-size:22px; display:grid; place-items:center; text-decoration:none;
  transition:transform .15s;
}
.icon-btn:active { transform:scale(.88); }

/* ---------- HUD ---------- */
.hud {
  position:fixed; top:0; left:0; right:0; z-index:5;
  padding:calc(10px + env(safe-area-inset-top)) 12px 0;
  display:flex; align-items:center; gap:10px; pointer-events:none;
}
.hud > * { pointer-events:auto; }
.gauge {
  flex:1; max-width:520px; margin:0 auto; height:34px; border-radius:20px; position:relative; overflow:hidden;
  background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.3);
}
.gauge-fill {
  position:absolute; left:0; top:0; bottom:0; width:0%; overflow:hidden; border-radius:18px;
  background:linear-gradient(90deg,#ff5c6c,#ff9f43,#ffd93d,#4cd97b,#4aa8ff,#a66bff,#ff7ad9);
  transition:width .45s cubic-bezier(.3,1.6,.5,1);
}
.gauge-fill::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  transform:translateX(-100%); animation:shimmer 2.2s infinite;
}
@keyframes shimmer { to { transform:translateX(100%); } }
.gauge-label {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:17px; letter-spacing:.5px; text-shadow:0 1px 3px rgba(0,0,0,.8), 0 0 6px rgba(0,0,0,.5);
}
.gauge.bump { animation:bump .35s ease-out; }
.gauge.near { box-shadow:0 0 0 3px rgba(255,230,120,.6), 0 0 18px rgba(255,220,100,.7); }
@keyframes bump { 40% { transform:scale(1.07); } }

/* ---------- bottom controls ---------- */
.controls {
  position:fixed; left:0; right:0; bottom:0; z-index:5; pointer-events:none;
  padding:0 16px calc(18px + env(safe-area-inset-bottom));
  display:flex; justify-content:center; align-items:flex-end;
}
.ah-btn {
  pointer-events:auto; position:relative; touch-action:none;
  width:100px; height:100px; border-radius:50%; border:none;
  color:#5a1035; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;
  background:radial-gradient(circle at 35% 28%, #fff 0%, #ffd6ef 38%, #ff8ccf 100%);
  box-shadow:0 7px 0 #c2408f, 0 12px 26px rgba(0,0,0,.45);
  transition:transform .08s, box-shadow .08s;
}
.ah-btn span { font-size:34px; }
.ah-btn small { font-size:14px; opacity:.75; margin-top:2px; }
.ah-btn.down { transform:translateY(5px); box-shadow:0 2px 0 #c2408f, 0 6px 14px rgba(0,0,0,.45); }
.ah-btn::before {
  content:''; position:absolute; inset:-10px; border-radius:50%; pointer-events:none;
  border:4px solid rgba(255,255,255,.85);
  transform:scale(calc(1 + var(--lv, 0) * .55)); opacity:calc(var(--lv, 0) * 1.3);
}
.mic-chip {
  pointer-events:auto; position:absolute; left:16px; bottom:calc(36px + env(safe-area-inset-bottom));
  height:52px; min-width:52px; padding:0 14px; border-radius:26px; gap:6px;
  display:flex; align-items:center; justify-content:center;
  border:2px solid rgba(255,255,255,.28); background:rgba(255,255,255,.12); color:#fff; font-size:22px;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
.mic-chip.on { border-color:rgba(125,255,176,.75); }
.mic-chip .bars { display:none; gap:3px; align-items:flex-end; height:24px; }
.mic-chip.on .bars { display:flex; }
.mic-chip .bars i { display:block; width:5px; height:4px; border-radius:3px; background:#7dffb0; }
.mic-chip .mic-x { display:none; font-size:16px; color:#ff8aa0; }
.mic-chip.off .mic-x { display:inline; }
.mic-chip.asking { opacity:.6; }

/* ---------- title ---------- */
.overlay {
  position:fixed; inset:0; z-index:10;
  display:flex; flex-direction:column; align-items:center;
  padding:calc(24px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  text-align:center;
}
.corner { position:absolute; top:calc(12px + env(safe-area-inset-top)); left:12px; }
.corner.right { left:auto; right:12px; }
.logo {
  margin-top:4vh; display:flex; flex-direction:column; line-height:1.02; font-weight:400;
  font-size:clamp(46px, 13vw, 92px);
  background:linear-gradient(90deg,#ff7a8a,#ffb86b,#ffe066,#7ff0a8,#7cc4ff,#c49bff,#ff9ae6);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 rgba(30,10,80,.9)) drop-shadow(0 0 22px rgba(160,120,255,.45));
  animation:float 3.2s ease-in-out infinite;
}
.logo span:first-child { font-size:.8em; }
@keyframes float { 50% { transform:translateY(-8px) rotate(-1deg); } }
.how { margin-top:14px; font-size:clamp(17px, 4.6vw, 22px); color:#e6ddff; line-height:1.45; text-shadow:0 2px 6px rgba(0,0,0,.6); }
.how b { color:#ffe066; font-weight:400; }
.spacer { flex:1; min-height:150px; }
.now { font-size:17px; color:#cfc4ff; margin-bottom:12px; text-shadow:0 2px 6px rgba(0,0,0,.7); }
.big-btn {
  border:none; border-radius:40px; padding:16px 56px; font-size:32px; color:#5a2d00;
  background:linear-gradient(180deg,#fff08a,#ffc22e); box-shadow:0 7px 0 #c77800, 0 12px 26px rgba(0,0,0,.4);
  transition:transform .1s, box-shadow .1s; animation:breathe 1.8s ease-in-out infinite;
}
.big-btn:active { transform:translateY(5px); box-shadow:0 2px 0 #c77800, 0 6px 12px rgba(0,0,0,.4); animation:none; }
.big-btn.small { font-size:26px; padding:12px 44px; }
@keyframes breathe { 50% { transform:scale(1.05); } }
.mid-btn {
  margin-top:14px; border:2px solid rgba(255,255,255,.3); border-radius:30px; padding:10px 26px;
  font-size:20px; color:#fff; background:rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
.mid-btn:active { transform:scale(.95); }
.parent { margin-top:16px; max-width:420px; font-size:13px; line-height:1.5; color:rgba(220,210,255,.6); font-family:-apple-system,'Apple SD Gothic Neo',sans-serif; }

/* ---------- evolution banner ---------- */
.banner {
  position:fixed; left:0; right:0; bottom:0; z-index:12; display:flex; justify-content:center;
  padding:0 16px calc(22px + env(safe-area-inset-bottom));
}
.banner-card {
  width:100%; max-width:440px; border-radius:28px; padding:18px 20px 22px; text-align:center;
  background:linear-gradient(180deg,rgba(60,36,140,.95),rgba(30,18,80,.95));
  border:3px solid rgba(255,230,140,.8); box-shadow:0 0 40px rgba(255,210,120,.35), 0 14px 30px rgba(0,0,0,.5);
  animation:popIn .55s cubic-bezier(.3,1.7,.5,1);
}
@keyframes popIn { from { transform:translateY(40px) scale(.7); opacity:0; } }
.banner-tag { display:inline-block; padding:4px 14px; border-radius:14px; background:#ffe066; color:#6a3a00; font-size:17px; }
.banner-title {
  margin:10px 0 6px; font-size:clamp(30px, 8.5vw, 42px);
  background:linear-gradient(90deg,#ffb3c1,#ffe8a3,#a8f5c8,#a8d8ff,#e2c8ff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.banner-msg { font-size:19px; color:#e6ddff; margin-bottom:16px; line-height:1.4; }

/* ---------- dex ---------- */
.panel {
  z-index:20; background:rgba(12,8,40,.94);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  padding-left:12px; padding-right:12px;
}
.dex-head { width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.dex-head h2 { font-weight:400; font-size:26px; }
.dex-head h2 span { font-size:18px; color:#ffe066; }
.dex-body { flex:1; width:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:14px 0 10px; }
.dex-baby { display:flex; justify-content:center; align-items:center; gap:12px; margin-bottom:14px; }
.dex-baby .lbl { font-size:18px; color:#cfc4ff; }
.dex-grid {
  display:grid; grid-template-columns:26px repeat(4, minmax(54px, 92px)); gap:8px;
  justify-content:center; align-items:center;
}
.dex-grid .col-head { font-size:14px; color:#cfc4ff; text-align:center; }
.dex-grid .dot { width:20px; height:20px; border-radius:50%; justify-self:center; box-shadow:0 0 8px currentColor; }
.dex-cell {
  aspect-ratio:1; width:100%; border-radius:16px; border:2px solid rgba(255,255,255,.14);
  background:radial-gradient(circle at 50% 40%, rgba(255,255,255,.14), rgba(255,255,255,.03));
  padding:0; display:block; transition:transform .12s;
}
.dex-baby .dex-cell { width:92px; }
.dex-cell canvas { width:100%; height:100%; display:block; }
.dex-cell:active { transform:scale(.92); }
.dex-cell.locked { background:rgba(255,255,255,.04); border-style:dashed; }
.dex-foot { margin-top:18px; font-size:16px; color:#cfc4ff; }
.dex-foot b { color:#ffe066; font-weight:400; }

.toast {
  position:fixed; left:50%; top:calc(76px + env(safe-area-inset-top)); z-index:30;
  transform:translateX(-50%) translateY(-10px); opacity:0; pointer-events:none;
  max-width:min(92vw, 440px); padding:10px 18px; border-radius:18px; text-align:center;
  background:rgba(255,255,255,.95); color:#3a1d6e; font-size:17px; line-height:1.4;
  box-shadow:0 8px 24px rgba(0,0,0,.4); transition:opacity .25s, transform .25s;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud hidden" id="hud">
  <a class="icon-btn" href="../" aria-label="게임 목록">🏠</a>
  <div class="gauge" id="gauge"><div class="gauge-fill" id="gaugeFill"></div><div class="gauge-label" id="gaugeLabel"></div></div>
  <button class="icon-btn" id="dexBtn" aria-label="몬스터 도감">📖</button>
</div>

<div class="controls hidden" id="controls">
  <button class="mic-chip off" id="micChip" aria-label="마이크"><span>🎤</span><span class="bars"><i></i><i></i><i></i><i></i></span><span class="mic-x">✕</span></button>
  <button class="ah-btn" id="ahBtn" aria-label="꾹 누르고 있으면 아~"><span>아~</span><small>꾹!</small></button>
</div>

<div class="overlay" id="title">
  <a class="icon-btn corner" href="../" aria-label="게임 목록">🏠</a>
  <button class="icon-btn corner right mute-btn" aria-label="소리 켜기/끄기">🔊</button>
  <h1 class="logo"><span>냠냠</span><span>우주 몬스터</span></h1>
  <p class="how">혜성이 날아오면 <b>"아~"</b> 하고 소리 내 봐!<br>몬스터가 냠냠 먹고 변신해요</p>
  <div class="spacer"></div>
  <p class="now" id="nowName"></p>
  <button class="big-btn" id="startBtn">시작!</button>
  <button class="mid-btn" id="titleDexBtn">📖 몬스터 도감</button>
  <p class="parent">보호자분께: 시작하면 마이크 사용을 물어봐요. 소리 크기만 재고, 녹음하거나 어디로 보내지 않아요. 마이크가 없으면 화면의 "아~" 버튼을 꾹 누르면 돼요.</p>
</div>

<div class="banner hidden" id="banner">
  <div class="banner-card">
    <div class="banner-tag" id="bTag"></div>
    <div class="banner-title" id="bTitle"></div>
    <div class="banner-msg" id="bMsg"></div>
    <button class="big-btn small" id="bOk">좋아!</button>
  </div>
</div>

<div class="overlay panel hidden" id="dex">
  <div class="dex-head">
    <button class="icon-btn mute-btn" aria-label="소리 켜기/끄기">🔊</button>
    <h2>몬스터 도감 <span id="dexCount"></span></h2>
    <button class="icon-btn" id="dexClose" aria-label="닫기">✕</button>
  </div>
  <div class="dex-body">
    <div class="dex-baby" id="dexBaby"></div>
    <div class="dex-grid" id="dexGrid"></div>
    <p class="dex-foot">지금까지 냠냠 <b id="totalCount">0</b>개 · 별이 된 은하 대왕 <b id="raisedCount">0</b>마리</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const cvs = $('#c'), ctx = cvs.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

const COLORS = [
  { name: '빨강', h: 355, s: 88, l: 64 },
  { name: '주황', h: 28,  s: 95, l: 60 },
  { name: '노랑', h: 48,  s: 98, l: 58 },
  { name: '초록', h: 140, s: 62, l: 54 },
  { name: '파랑', h: 210, s: 92, l: 62 },
  { name: '보라', h: 268, s: 85, l: 68 },
  { name: '분홍', h: 320, s: 90, l: 70 },
];
const BABY = { h: 168, s: 62, l: 66 };
const GOLD = { h: 46, s: 100, l: 60 };
const STAGES = [
  { name: '아기 몬스터', r: 40, need: 6 },
  { name: '뿔 몬스터',   r: 50, need: 9 },
  { name: '날개 몬스터', r: 57, need: 12 },
  { name: '왕관 몬스터', r: 64, need: 15 },
  { name: '은하 대왕',   r: 70, need: 18 },
];
const STAGE_MSG = ['', '머리에 멋진 뿔이 났어!', '날개가 생기고 눈이 하나 더 생겼어!', '반짝반짝 왕관을 썼어!', '우주에서 제일 멋진 은하 대왕이야!'];
const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66];
const GALAXY_DOTS = Array.from({ length: 16 }, (_, i) => ({
  x: Math.sin(i * 91.7) * 0.75, y: Math.sin(i * 47.3 + 1) * 0.7, s: 0.035 + (i % 4) * 0.01, p: i * 1.7,
}));

const hsl = (c, dl = 0, ds = 0, a = 1) => `hsla(${c.h},${clamp(c.s + ds, 0, 100)}%,${clamp(c.l + dl, 0, 100)}%,${a})`;
const colorOf = (stage, ci) => (stage === 0 || ci < 0) ? BABY : COLORS[ci];
const monName = (stage, ci) => stage === 0 ? '아기 몬스터' : `${COLORS[ci].name} ${STAGES[stage].name}`;
function ro(w) {
  const c = w.charCodeAt(w.length - 1) - 0xAC00;
  if (c < 0 || c > 11171) return '로';
  const j = c % 28;
  return (j === 0 || j === 8) ? '로' : '으로';
}

/* ---------------- save ---------------- */
const SAVE_KEY = 'monsterSnack.v1';
const defaultSave = () => ({ stage: 0, gauge: 0, color: -1, eaten: [0,0,0,0,0,0,0], total: 0, raised: 0, kings: [], dex: { b: 1 }, muted: false });
let save = defaultSave();
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && typeof s === 'object') save = Object.assign(defaultSave(), s);
} catch (e) {}
if (!(save.stage >= 0 && save.stage <= 4)) save.stage = 0;
if (save.stage > 0 && !(save.color >= 0 && save.color < 7)) save.color = 0;
if (!Array.isArray(save.eaten) || save.eaten.length !== 7) save.eaten = [0,0,0,0,0,0,0];
if (!Array.isArray(save.kings)) save.kings = [];
if (!save.dex || typeof save.dex !== 'object') save.dex = { b: 1 };
let saveTimer = 0;
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 300); }

/* ---------------- audio ---------------- */
let AC = null, master = null, noiseBuf = null, sfxHold = 0;
function initAudio() {
  if (!AC) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    AC = new Ctx();
    master = AC.createGain();
    master.gain.value = save.muted ? 0 : 0.55;
    master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
}
function tone(f, d, o = {}) {
  if (!AC || save.muted) return;
  const t0 = AC.currentTime + (o.t || 0);
  const osc = AC.createOscillator(), gn = AC.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t0);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + (o.glide || d));
  const g = o.g == null ? 0.25 : o.g;
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(g, t0 + (o.a || 0.006));
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  osc.connect(gn); gn.connect(master);
  osc.start(t0); osc.stop(t0 + d + 0.05);
  sfxHold = Math.max(sfxHold, (o.t || 0) + d * 0.7);
}
function noise(d, o = {}) {
  if (!AC || save.muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t0 = AC.currentTime + (o.t || 0);
  const src = AC.createBufferSource(), flt = AC.createBiquadFilter(), gn = AC.createGain();
  src.buffer = noiseBuf;
  flt.type = o.ft || 'bandpass'; flt.frequency.value = o.ff || 1200; flt.Q.value = o.q || 1;
  gn.gain.setValueAtTime(o.g || 0.15, t0);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  src.connect(flt); flt.connect(gn); gn.connect(master);
  src.start(t0); src.stop(t0 + d + 0.05);
  sfxHold = Math.max(sfxHold, (o.t || 0) + d * 0.7);
}
const SFX = {
  eat(ci) {
    const n = NOTES[ci];
    tone(n * 0.7, 0.15, { type: 'triangle', f2: n, glide: 0.06, g: 0.28 });
    tone(n * 2, 0.24, { t: 0.05, g: 0.08 });
    tone(170, 0.08, { type: 'square', f2: 80, g: 0.05 });
  },
  golden() { [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f, 0.32, { t: i * 0.06, type: 'triangle', g: 0.17 })); },
  pop() { tone(520, 0.1, { f2: 950, glide: 0.06, g: 0.16 }); },
  giggle() { [880, 1046, 880, 1175].forEach((f, i) => tone(f, 0.09, { t: i * 0.08, type: 'triangle', f2: f * 1.15, g: 0.12 })); },
  burp() {
    if (!AC || save.muted) return;
    const t0 = AC.currentTime;
    const osc = AC.createOscillator(), wob = AC.createGain(), env = AC.createGain(), flt = AC.createBiquadFilter();
    const lfo = AC.createOscillator(), lg = AC.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(105, t0);
    osc.frequency.exponentialRampToValueAtTime(58, t0 + 0.6);
    lfo.frequency.value = 26; lg.gain.value = 0.45; wob.gain.value = 0.55;
    lfo.connect(lg); lg.connect(wob.gain);
    flt.type = 'lowpass'; flt.frequency.value = 700; flt.Q.value = 4;
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.exponentialRampToValueAtTime(0.5, t0 + 0.04);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.62);
    osc.connect(wob); wob.connect(flt); flt.connect(env); env.connect(master);
    osc.start(t0); lfo.start(t0); osc.stop(t0 + 0.7); lfo.stop(t0 + 0.7);

  if (!evo.swapped) {
    if (Math.random() < dt * 40) {
      const a = rand(TAU), rr = rand(120, 200) * S;
      parts.push({ type: 'in', x: mon.x + Math.cos(a) * rr, y: mon.by + Math.sin(a) * rr, tx: mon.x, ty: mon.by, follow: false, sp: 80 * S, life: 1.5, max: 1.5, size: rand(2.5, 5) * S, hue: rand(360) });
    }
    if (evo.t >= evo.ts) swapForm();
    return;
  }
  const u = evo.t - evo.ts;
  if (evo.final && !evo.hatched) {
    if (!evo.cracked && u > 0.9) { evo.cracked = true; SFX.crack(); }
    if (u > 1.4) {
      evo.hatched = true; evo.hatchT = evo.t;
      SFX.hatch();
      for (let i = 0; i < 9; i++) {
        const a = -Math.PI / 2 + rand(-1.3, 1.3), sp = rand(160, 320) * S;
        parts.push({ type: 'shell', x: mon.x + rand(-10, 10) * S, y: mon.by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.4, max: 1.4, size: rand(6, 11) * S, spin: rand(TAU) });
      }
      rainbowBurst(mon.x, mon.by, 30, 1.3);
    }
  }
  const showAt = evo.final ? (evo.hatched ? evo.hatchT + 0.6 : Infinity) : evo.ts + 0.6;
  if (!evo.banner && evo.t >= showAt) { evo.banner = true; showBanner(); }
}
function swapForm() {
  evo.swapped = true; flash = 1;
  if (evo.final) {
    save.kings.push(save.color);
    if (save.kings.length > 14) save.kings.shift();
    save.raised++;
    const p = kingPos(save.kings.length - 1);
    flyStar = { x0: mon.x, y0: mon.by - H * 0.12, x1: p.x, y1: p.y, t: 0, col: COLORS[save.color] || GOLD };
    SFX.starFly();
  }
  save.stage = evo.to; save.color = evo.cTo; save.gauge = 0; save.eaten = [0,0,0,0,0,0,0];
  const key = save.stage === 0 ? 'b' : `${save.color}-${save.stage}`;
  evo.isNew = !save.dex[key];
  save.dex[key] = 1;
  persist();
  updateGaugeUI(false);
  setTarget(mon.tx, mon.ty);
  if (!evo.final) { SFX.fanfare(); rainbowBurst(mon.x, mon.by, 36, 1.6); }
}
function showBanner() {
  let tag, title, msg, speech;
  if (evo.final) {
    tag = '새 친구 탄생!'; title = '아기 몬스터'; msg = '은하 대왕은 하늘의 별이 되었어. 위를 봐!';
    speech = '우와! 은하 대왕이 반짝이는 별이 되었어! 그리고 새 아기 몬스터가 태어났어!';
  } else {
    title = monName(save.stage, save.color);
    tag = evo.isNew ? '새 몬스터 발견!' : '짠! 변신!';
    msg = STAGE_MSG[save.stage];
    speech = `짠! ${title}${ro(title)} 변신했어! ${msg}`;
  }
  $('#bTag').textContent = tag; $('#bTitle').textContent = title; $('#bMsg').textContent = msg;
  $('#banner').classList.remove('hidden');
  say(speech);
}
function closeBanner() {
  if (!evo || !evo.banner) return;
  SFX.pop();
  $('#banner').classList.add('hidden');
  evo = null; state = 'play'; spawnT = 0.4; hintT = 0; evoPending = -1;
}
function doBurp() {
  SFX.burp();
  const r = monR() * mon.zoom;
  addText('꺼억~', mon.x + r * 0.9, mon.by - r * 0.7, '#b8ffcf', 30);
  mon.squash = 0.55;
  for (let i = 0; i < 6; i++) parts.push({ type: 'dot', x: MP.x, y: MP.y, vx: rand(-60, 60) * S, vy: -rand(60, 140) * S, life: 0.9, max: 0.9, size: rand(4, 8) * S, hue: 140, lt: 80, spin: 0 });
}
function tickle() {
  if (tickleCD > 0) return;
  tickleCD = 0.5;
  initAudio(); SFX.giggle();
  mon.squash = 0.55;
  const r = monR() * mon.zoom;
  addText(['히히!', '간지러워!', '헤헤~'][Math.floor(rand(3))], mon.x, mon.by - r * 1.5, '#ffd6ef', 26);
}
function hintText() {
  const main = micState === 'on' ? '"아~" 하고 소리 내 봐!' : '"아~" 버튼을 꾹 눌러 봐!';
  if (save.total < 4) return main;
  const tips = [main, '손가락으로 끌면 내가 움직여!', '많이 먹은 색깔로 변신해!', '황금 별은 세 개만큼이야!'];
  return tips[Math.floor(time / 4) % tips.length];
}

/* ---------------- update & render ---------------- */
function update(dt) {
  sfxHold = Math.max(0, sfxHold - dt);
  tickleCD -= dt;
  flash = Math.max(0, flash - dt * 1.6);
  readVoice(dt);

  const playing = state === 'play' && !overlayOpen;
  const titleZoom = clamp(Math.min(60, H * 0.075) / STAGES[save.stage].r, 0.7, 1.5);
  mon.zoom = lerp(mon.zoom, state === 'title' ? titleZoom : 1, Math.min(1, dt * 4));
  if (state === 'title') { mon.tx = W / 2; mon.ty = H * 0.53; }
  const px = mon.x;
  mon.x += (mon.tx - mon.x) * Math.min(1, dt * 3.2);
  mon.y += (mon.ty - mon.y) * Math.min(1, dt * 3.2);
  mon.tilt = lerp(mon.tilt, clamp((mon.x - px) / Math.max(dt, 0.001) * 0.0012, -0.3, 0.3), Math.min(1, dt * 6));
  mon.by = mon.y + Math.sin(time * 2.2) * 6 * S;
  const r = monR() * mon.zoom;
  MP = { x: mon.x, y: mon.by + r * 0.36 };
  mon.mouth += ((playing ? voice : 0) - mon.mouth) * Math.min(1, dt * 14);
  mon.puff = Math.max(0, mon.puff - dt * 2.2);
  mon.squash *= Math.pow(0.02, dt);
  mon.blinkT -= dt;
  if (mon.blinkT < 0) { mon.blink = 1; mon.blinkT = rand(2, 5); }
  mon.blink = Math.max(0, mon.blink - dt * 7);
  let lx = Math.sin(time * 0.7) * 0.6, ly = 0.15;
  if (state !== 'title') {
    let best = null, bd = 1e9;
    for (const c of comets) { const d = Math.hypot(c.x - mon.x, c.y - mon.by); if (d < bd) { bd = d; best = c; } }
    if (best) { lx = (best.x - mon.x) / bd; ly = (best.y - mon.by) / bd; }
  }
  mon.lookX = lerp(mon.lookX, lx, Math.min(1, dt * 8));
  mon.lookY = lerp(mon.lookY, ly, Math.min(1, dt * 8));

  if ((state === 'title' || state === 'play') && !overlayOpen) {
    waveT -= dt;
    if (waveT < 0) { waveT = rand(7, 11); waveColor = (waveColor + 1 + Math.floor(rand(6))) % 7; }
    spawnT -= dt;
    const maxC = Math.round(clamp(W * H / 90000, 6, 11));
    if (spawnT <= 0 && comets.length < maxC) { spawnComet(); spawnT = comets.length < 3 ? rand(0.3, 0.6) : rand(0.8, 1.4); }
  }
  if (!overlayOpen) updateComets(dt);
  updateParticles(dt);

  const sucking = playing && voice > 0.08;
  if (wasSucking && !sucking) { if (breathEaten >= 3) burpTimer = 0.35; breathEaten = 0; }
  wasSucking = sucking;
  if (burpTimer > 0) { burpTimer -= dt; if (burpTimer <= 0 && state === 'play') doBurp(); }

  if (evoPending > 0 && state === 'play') { evoPending -= dt; if (evoPending <= 0) { evoPending = -1; startEvolve(); } }
  if (state === 'evolve') updateEvolve(dt);

  if (flyStar) {
    flyStar.t += dt / 1.1;
    const f = Math.min(1, flyStar.t), e = 1 - Math.pow(1 - f, 3);
    const x = lerp(flyStar.x0, flyStar.x1, e), y = lerp(flyStar.y0, flyStar.y1, e) - Math.sin(f * Math.PI) * 60 * S;
    flyStar.x = x; flyStar.y = y;
    parts.push({ type: 'star', x, y, vx: rand(-30, 30) * S, vy: rand(-30, 30) * S, life: 0.6, max: 0.6, size: rand(3, 6) * S, hue: flyStar.col.h, lt: 75, spin: rand(TAU) });
    if (f >= 1) { burst(flyStar.x1, flyStar.y1, flyStar.col, 20, 1.2); flyStar = null; }
  }

  if (playing && voice <= 0.05) hintT += dt; else hintT = 0;
  hintVisible = playing && evoPending < 0 && hintT > (save.total === 0 ? 1.0 : 7);
  updateLiveUI();
}
function render(dt) {
  const g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground(g, dt);
  const r = monR() * mon.zoom;
  if (evo) {
    let a = !evo.swapped ? evo.t / evo.ts : Math.max(0, 1 - (evo.t - evo.ts) / 1.6);
    if (evo.final && evo.swapped) a = evo.hatched ? Math.max(0, 1 - (evo.t - evo.hatchT) / 1.6) : 0.25;
    if (a > 0) {
      g.save(); g.translate(mon.x, mon.by); g.rotate(time * 0.6); g.globalCompositeOperation = 'lighter';
      const L = Math.max(W, H);
      for (let i = 0; i < 12; i++) {
        g.rotate(TAU / 12);
        g.fillStyle = `hsla(${i * 30},100%,70%,${a * 0.28})`;
        g.beginPath(); g.moveTo(0, 0); g.lineTo(-34 * S, -L); g.lineTo(34 * S, -L); g.closePath(); g.fill();
      }
      g.restore();
    }
  }
  if (state === 'play' && !overlayOpen && voice > 0.05) drawSuction(g, suckRadius(r), voice);
  for (const c of comets) drawComet(g, c);
  drawMonsterMain(g, r);
  if (flyStar) { g.fillStyle = '#fff'; sparkle(g, flyStar.x, flyStar.y, 14 * S, time * 5); }
  drawParticles(g);
  drawTexts(g);
  if (hintVisible) {
    const st = save.stage;
    drawBubble(g, hintText(), mon.x, mon.by - r * (st === 0 ? 1.55 : st >= 3 ? 1.75 : 1.5));
  }
  if (flash > 0) { g.fillStyle = `rgba(255,255,255,${flash})`; g.fillRect(0, 0, W, H); }
}
function drawMonsterMain(g, r) {
  let x = mon.x, y = mon.by, scale = 1, shake = 0, glowA = 0;
  if (evo) {
    if (!evo.swapped) {
      const p = Math.min(1, evo.t / evo.ts);
      shake = p * p; scale = 1 + p * 0.12; glowA = p;
      if (evo.final) y -= p * p * H * 0.12;
    } else {
      const u = evo.t - evo.ts;
      if (evo.final && !evo.hatched) { drawEgg(g, x, y, monR(0) * 1.05, time, clamp((u - 0.2) / 0.9, 0, 1)); return; }
      const hu = evo.final ? evo.t - evo.hatchT : u;
      scale = 0.4 + 0.6 * easeOutBack(clamp(hu / 0.7, 0, 1));
      glowA = Math.max(0, 1 - hu);
    }
    x += rand(-1, 1) * shake * 7 * S; y += rand(-1, 1) * shake * 5 * S;
  }
  if (glowA > 0) {
    g.save(); g.globalAlpha = glowA * 0.9; g.globalCompositeOperation = 'lighter';
    const s = r * 5 * (0.6 + glowA * 0.6);
    g.drawImage(glowSprite(50, 100, 85), x - s / 2, y - s / 2, s, s);
    g.restore();
  }
  drawMonster(g, x, y, r * scale, {
    stage: save.stage, col: colorOf(save.stage, save.color), t: time, mouth: mon.mouth,
    lookX: mon.lookX, lookY: mon.lookY, blink: mon.blink, puff: mon.puff, squash: mon.squash, tilt: mon.tilt,
  });
  if (evo && !evo.swapped && glowA > 0.4) {
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = (glowA - 0.4) * 1.4;
    const s = r * 3.2;
    g.drawImage(glowSprite(0, 0, 100), x - s / 2, y - s / 2, s, s);
    g.restore();
  }
}

/* ---------------- UI ---------------- */
const gaugeEl = $('#gauge'), gaugeFill = $('#gaugeFill'), gaugeLabel = $('#gaugeLabel');
const ahBtn = $('#ahBtn'), micChip = $('#micChip'), bars = [...micChip.querySelectorAll('.bars i')];
let lastLv = -1, barH = [0, 0, 0, 0], toastTimer = 0;
function updateGaugeUI(bump) {
  const need = STAGES[save.stage].need, left = Math.max(0, need - save.gauge);
  gaugeFill.style.width = Math.min(100, save.gauge / need * 100) + '%';
  gaugeLabel.textContent = save.stage === 4 ? `🥚 새 친구까지 ${left}개` : `⭐ 변신까지 ${left}개`;
  gaugeEl.classList.toggle('near', left > 0 && left <= 2);
  if (bump) { gaugeEl.classList.remove('bump'); void gaugeEl.offsetWidth; gaugeEl.classList.add('bump'); }
}
function updateMicUI() {
  micChip.classList.toggle('on', micState === 'on');
  micChip.classList.toggle('off', micState === 'off');
  micChip.classList.toggle('asking', micState === 'asking');
}
function updateLiveUI() {
  const lv = Math.round(voice * 20) / 20;
  if (lv !== lastLv) { ahBtn.style.setProperty('--lv', lv); lastLv = lv; }
  if (micState === 'on') {
    bars.forEach((b, i) => {
      const h = Math.round(4 + 20 * clamp(voice * 1.4 - i * 0.22, 0, 1));
      if (h !== barH[i]) { b.style.height = h + 'px'; barH[i] = h; }
    });
  }
}
function updateTitle() { $('#nowName').textContent = `지금 내 몬스터: ${monName(save.stage, save.color)}`; }
function updateMuteUI() {
  document.querySelectorAll('.mute-btn').forEach(b => { b.textContent = save.muted ? '🔇' : '🔊'; });
  if (master) master.gain.value = save.muted ? 0 : 0.55;
}
function toast(html) {
  const t = $('#toast');
  t.innerHTML = html; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
}
function toggleMute() {
  initAudio();
  save.muted = !save.muted;
  if (save.muted && 'speechSynthesis' in window) speechSynthesis.cancel();
  updateMuteUI(); persist();
  if (!save.muted) SFX.pop();
}

/* ---------------- dex ---------------- */
function drawThumb(c, stage, ci, seen) {
  const g = c.getContext('2d');
  g.clearRect(0, 0, 128, 128);
  const r = stage === 0 ? 34 : stage === 4 ? 27 : 30;
  drawMonster(g, 64, stage === 0 ? 76 : 74, r, { stage, col: colorOf(stage, ci), t: 1.3, mouth: 0, lookX: 0, lookY: 0.2, blink: 0, puff: 0, squash: 0, tilt: 0 });
  if (!seen) {
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = '#2b2266'; g.fillRect(0, 0, 128, 128);
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = 'rgba(255,255,255,.75)'; g.font = '44px Jua, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('?', 64, 70);
  }
}
function makeCell(stage, ci) {
  const key = stage === 0 ? 'b' : `${ci}-${stage}`, seen = !!save.dex[key];
  const b = document.createElement('button');
  b.className = 'dex-cell' + (seen ? '' : ' locked');
  const c = document.createElement('canvas'); c.width = c.height = 128;
  drawThumb(c, stage, ci, seen);
  b.appendChild(c);
  const name = monName(stage, ci);
  b.setAttribute('aria-label', seen ? name : '아직 못 만난 몬스터');
  b.addEventListener('click', () => {
    initAudio(); SFX.pop();
    if (seen) { toast(name); say(name); }
    else { toast(`아직 못 만난 몬스터!<br><small>${COLORS[ci].name} 혜성을 많이 먹어 봐</small>`); say(`${COLORS[ci].name} 혜성을 많이 먹어 봐!`); }
  });
  return b;
}
function buildDex() {
  const baby = $('#dexBaby'), grid = $('#dexGrid');
  baby.innerHTML = ''; grid.innerHTML = '';
  const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = '아기 몬스터';
  baby.append(makeCell(0, -1), lbl);
  grid.appendChild(document.createElement('span'));
  for (let s = 1; s <= 4; s++) { const h = document.createElement('span'); h.className = 'col-head'; h.textContent = ['', '뿔', '날개', '왕관', '은하 대왕'][s]; grid.appendChild(h); }
  let seen = save.dex.b ? 1 : 0;
  for (let ci = 0; ci < 7; ci++) {
    const dot = document.createElement('span'); dot.className = 'dot';
    dot.style.background = hsl(COLORS[ci]); dot.style.color = hsl(COLORS[ci]);
    grid.appendChild(dot);
    for (let s = 1; s <= 4; s++) { grid.appendChild(makeCell(s, ci)); if (save.dex[`${ci}-${s}`]) seen++; }
  }
  $('#dexCount').textContent = `${seen} / 29`;
  $('#totalCount').textContent = save.total;
  $('#raisedCount').textContent = save.raised;
}
function openDex() {
  initAudio(); SFX.pop();
  overlayOpen = true; holding = false; keyHold = false; ahBtn.classList.remove('down');
  buildDex();
  $('#dex').classList.remove('hidden');
}
function closeDex() {
  SFX.pop();
  overlayOpen = false;
  $('#dex').classList.add('hidden');
}

/* ---------------- events ---------------- */
$('#startBtn').addEventListener('click', () => {
  initAudio(); SFX.pop();
  $('#title').classList.add('hidden');
  $('#hud').classList.remove('hidden');
  $('#controls').classList.remove('hidden');
  state = 'play'; hintT = 0; spawnT = 0.3;
  setTarget(W / 2, H * 0.55);
  updateGaugeUI(false);
  say(save.total === 0 ? '안녕! 나는 배고픈 우주 몬스터야. 혜성이 오면 아~ 하고 소리 내 줘!' : '또 왔구나! 아~ 하고 혜성을 먹자!');
  startMic();
});
$('#titleDexBtn').addEventListener('click', openDex);
$('#dexBtn').addEventListener('click', openDex);
$('#dexClose').addEventListener('click', closeDex);
document.querySelectorAll('.mute-btn').forEach(b => b.addEventListener('click', toggleMute));
$('#bOk').addEventListener('click', closeBanner);
micChip.addEventListener('click', () => {
  initAudio();
  if (micState === 'on') toast('마이크가 듣고 있어요! "아~" 해 봐요');
  else startMic();
});

const releaseHold = () => { holding = false; ahBtn.classList.remove('down'); };
ahBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (state !== 'play' || overlayOpen) return;
  holding = true; ahBtn.classList.add('down');
  try { ahBtn.setPointerCapture(e.pointerId); } catch (err) {}
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => ahBtn.addEventListener(ev, releaseHold));
ahBtn.addEventListener('contextmenu', e => e.preventDefault());

let dragId = null;
cvs.addEventListener('pointerdown', e => {
  initAudio();
  const r = monR() * mon.zoom;
  if (Math.hypot(e.clientX - mon.x, e.clientY - mon.by) < r * 1.15) tickle();
  if (state === 'play' && !overlayOpen) {
    dragId = e.pointerId; setTarget(e.clientX, e.clientY);
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
cvs.addEventListener('pointermove', e => { if (e.pointerId === dragId && state === 'play') setTarget(e.clientX, e.clientY); });
['pointerup', 'pointercancel'].forEach(ev => cvs.addEventListener(ev, e => { if (e.pointerId === dragId) dragId = null; }));

window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (evo && evo.banner) { closeBanner(); return; }
    if (!e.repeat) { initAudio(); keyHold = true; }
  }
  const step = 50 * S;
  if (state === 'play' && !overlayOpen) {
    if (e.key === 'ArrowLeft') setTarget(mon.tx - step, mon.ty);
    if (e.key === 'ArrowRight') setTarget(mon.tx + step, mon.ty);
    if (e.key === 'ArrowUp') setTarget(mon.tx, mon.ty - step);
    if (e.key === 'ArrowDown') setTarget(mon.tx, mon.ty + step);
  }
  if (e.key === 'Escape' && overlayOpen) closeDex();
});
window.addEventListener('keyup', e => { if (e.code === 'Space') keyHold = false; });
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { releaseHold(); keyHold = false; if ('speechSynthesis' in window) speechSynthesis.cancel(); speaking = false; persist(); }
});
window.addEventListener('pagehide', persist);

/* ---------------- start ---------------- */
resize();
updateGaugeUI(false);
updateTitle();
updateMuteUI();
updateMicUI();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!document.hidden) { time += dt; update(dt); render(dt); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
