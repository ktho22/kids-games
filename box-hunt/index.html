<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>숨은 상자 찾기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  font-family:'Fredoka','Segoe UI',sans-serif;
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  width:100vw;
  height:100vh;
  height:100svh;
}
body {
  background:var(--bg, linear-gradient(160deg,#c3f0ca 0%,#7fd38f 100%));
  transition:background 0.6s;
  display:flex;
  flex-direction:column;
  align-items:center;
  color:#333;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
}
header {
  width:100%;
  max-width:640px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  gap:8px;
}
header a.back, .chip {
  font-family:inherit;
  cursor:pointer;
  text-decoration:none;
  background:rgba(255,255,255,0.75);
  padding:8px 14px;
  border-radius:20px;
  color:#444;
  font-size:0.95em;
  border:2px solid rgba(255,255,255,0.9);
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  white-space:nowrap;
}
h1 {
  font-size:1.5em;
  color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,0.18);
  text-align:center;
  flex:1;
}
.status {
  width:100%;
  max-width:640px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}
.found {
  font-size:1.1em;
  font-weight:600;
  background:rgba(255,255,255,0.85);
  padding:6px 14px;
  border-radius:16px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
.found .slots { letter-spacing:2px; }
.slot-empty { opacity:0.25; filter:grayscale(1); }
button.hint {
  font-family:inherit;
  font-size:1em;
  border:none;
  background:#fff3b0;
  color:#7a5b00;
  padding:8px 14px;
  border-radius:16px;
  box-shadow:0 3px 0 #e0c560;
  cursor:pointer;
  white-space:nowrap;
}
button.hint:disabled { opacity:0.45; cursor:default; }
button.hint:active:not(:disabled) { transform:translateY(2px); box-shadow:0 1px 0 #e0c560; }

.clue {
  width:100%;
  max-width:640px;
  background:#fff;
  border-radius:20px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 4px 0 rgba(0,0,0,0.12), 0 6px 16px rgba(0,0,0,0.12);
  margin-bottom:12px;
  min-height:84px;
}
.clue .mag { font-size:2em; flex-shrink:0; }
.clue .text {
  flex:1;
  font-size:1.25em;
  font-weight:600;
  line-height:1.4;
  color:#3b2d6b;
  word-break:keep-all;
}
.clue.new { animation:clueIn 0.45s ease; }
@keyframes clueIn {
  0% { transform:scale(0.9); opacity:0.3; }
  60% { transform:scale(1.03); }
  100% { transform:scale(1); opacity:1; }
}
.clue button.speak {
  font-size:1.6em;
  border:none;
  background:#eef3ff;
  border-radius:50%;
  width:52px;
  height:52px;
  flex-shrink:0;
  cursor:pointer;
}
.clue button.speak:active { transform:scale(0.92); }

#field {
  flex:1;
  width:100%;
  max-width:640px;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;
}
#grid { display:grid; gap:10px; }
.tile {
  position:relative;
  border-radius:20%;
  background:rgba(255,255,255,0.55);
  border:3px solid rgba(255,255,255,0.85);
  box-shadow:0 3px 0 rgba(0,0,0,0.08);
  cursor:pointer;
}
.tile .under, .tile .cover {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:calc(var(--cell) * 0.6);
  line-height:1;
}
.tile .under { opacity:0; transform:scale(0.4); transition:all 0.3s; }
.tile .cover {
  transition:transform 0.45s cubic-bezier(.3,1.6,.5,1), opacity 0.45s;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,0.15));
}
.tile:not(.open):active .cover { transform:scale(0.9); }
.tile.open { cursor:default; }
.tile.open .cover { transform:translateY(-70%) rotate(-20deg) scale(0.7); opacity:0; }
.tile.open .under { opacity:1; transform:scale(1); }
.tile.open.box {
  background:rgba(255,236,140,0.95);
  border-color:#ffd23f;
  box-shadow:0 0 18px 4px rgba(255,210,63,0.75);
}
.tile.open.box .under { animation:pop 0.6s ease; }
.tile.wrong { animation:shake 0.4s ease; }
.tile.hinting .cover { animation:wiggle 0.5s ease 3; }
.tile.glow {
  border-color:#ffd23f;
  box-shadow:0 0 0 4px rgba(255,210,63,0.6), 0 0 20px 6px rgba(255,210,63,0.6);
  animation:pulse 1s ease infinite;
}
@keyframes pop {
  0% { transform:scale(0.3); }
  60% { transform:scale(1.35) rotate(8deg); }
  100% { transform:scale(1); }
}
@keyframes wiggle {
  0%,100% { transform:rotate(0); }
  25% { transform:rotate(-14deg) scale(1.1); }
  75% { transform:rotate(14deg) scale(1.1); }
}
@keyframes shake {
  0%,100% { transform:translateX(0); }
  20%,60% { transform:translateX(-8px); }
  40%,80% { transform:translateX(8px); }
}
@keyframes pulse {
  0%,100% { transform:scale(1); }
  50% { transform:scale(1.06); }
}
.spark {
  position:fixed;
  pointer-events:none;
  font-size:22px;
  z-index:20;
  animation:fly 0.9s ease-out forwards;
}
@keyframes fly {
  from { transform:translate(0,0) scale(1); opacity:1; }
  to { transform:translate(var(--dx),var(--dy)) scale(0.4); opacity:0; }
}
.toast {
  position:fixed;
  left:50%;
  bottom:calc(28px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  background:rgba(40,30,80,0.88);
  color:#fff;
  padding:10px 20px;
  border-radius:20px;
  font-size:1.1em;
  opacity:0;
  transition:all 0.25s;
  pointer-events:none;
  z-index:25;
  white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:30;
  padding:16px;
}
.overlay.show { display:flex; }
.panel {
  background:#fff;
  border-radius:24px;
  padding:26px 22px;
  max-width:380px;
  width:100%;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  animation:pop 0.5s ease;
}
.panel .big { font-size:3.4em; margin-bottom:6px; }
.panel h2 { font-size:1.6em; margin-bottom:8px; }
.panel p { color:#555; font-size:1.05em; line-height:1.5; margin-bottom:14px; word-break:keep-all; }
.stars { font-size:2.2em; margin-bottom:10px; letter-spacing:4px; }
.stars .off { filter:grayscale(1); opacity:0.3; }
.prizes { font-size:1.8em; margin-bottom:14px; letter-spacing:4px; }
.panel button {
  font-family:inherit;
  font-size:1.2em;
  border:none;
  background:#48c774;
  color:#fff;
  padding:12px 28px;
  border-radius:18px;
  box-shadow:0 4px 0 #2f9e57;
  cursor:pointer;
  margin:4px;
}
.panel button.alt { background:#a0a8b8; box-shadow:0 4px 0 #7d8596; font-size:1em; }
.panel button:active { transform:translateY(3px); box-shadow:0 1px 0 #2f9e57; }
.collection {
  font-size:1.6em;
  line-height:1.5;
  max-height:40vh;
  overflow-y:auto;
  margin-bottom:14px;
  word-break:break-all;
}
.small { font-size:0.85em; color:#888; }
</style>
</head>
<body>
  <header>
    <a class="back" href="../">← Back</a>
    <h1>📦 숨은 상자 찾기</h1>
    <button class="chip" id="treasureBtn">🎒 <span id="treasureCount">0</span></button>
  </header>

  <div class="status">
    <div class="found"><span id="stageLabel">1단계</span> · <span class="slots" id="slots"></span></div>
    <button class="hint" id="hintBtn">💡 힌트 <span id="hintLeft">3</span></button>
  </div>

  <div class="clue" id="clue">
    <span class="mag">🔍</span>
    <span class="text" id="clueText"></span>
    <button class="speak" id="speakBtn" aria-label="다시 듣기">🔊</button>
  </div>

  <div id="field"><div id="grid"></div></div>
  <div class="toast" id="toast"></div>

  <div class="overlay" id="startOverlay">
    <div class="panel">
      <div class="big">📦🔍</div>
      <h2>숨은 상자 찾기</h2>
      <p>위에 나오는 <b>힌트</b>를 잘 듣고<br>딱 맞는 그림을 톡 눌러 보세요!<br>그 밑에 상자가 숨어 있어요 🎁</p>
      <button id="startBtn">시작!</button>
      <div id="resumeWrap" style="display:none; margin-top:6px;">
        <button class="alt" id="fromStartBtn">처음부터</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="clearOverlay">
    <div class="panel">
      <div class="big" id="clearEmoji">🎉</div>
      <h2 id="clearTitle">상자를 다 찾았어요!</h2>
      <div class="stars" id="stars"></div>
      <p id="clearText"></p>
      <div class="prizes" id="prizes"></div>
      <button id="nextBtn">다음 단계 ▶</button>
    </div>
  </div>

  <div class="overlay" id="treasureOverlay">
    <div class="panel">
      <div class="big">🎒</div>
      <h2>내 보물 가방</h2>
      <div class="collection" id="collection"></div>
      <button id="closeTreasure">닫기</button>
    </div>
  </div>

  { name:'보물섬',     pool:'all',    cols:4, rows:4, boxes:6, level:'riddle', bg:'linear-gradient(160deg,#ffe29a 0%,#ff9a6b 100%)' },
];
const SAVE_KEY = 'boxHunt.v1';

let save = loadSave();
let stageIdx = 0;
let tiles = [];
let targets = [];
let clueIdx = 0;
let misses = 0;
let missesThisClue = 0;
let hints = 3;
let busy = false;
let stagePrizes = [];

function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && Array.isArray(s.treasure)) return { stage: Math.min(s.stage || 0, STAGES.length - 1), treasure: s.treasure };
  } catch (e) {}
  return { stage: 0, treasure: [] };
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}

let audio;
function beep(freqs, dur = 0.12, type = 'sine') {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    let t = audio.currentTime;
    for (const f of freqs) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + dur);
      t += dur * 0.8;
    }
  } catch (e) {}
}

const canSpeak = 'speechSynthesis' in window;
let koVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v => /^ko/i.test(v.lang) && /yuna|유나/i.test(v.name))
    || vs.find(v => /^ko/i.test(v.lang)) || null;
}
if (canSpeak) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

let speakGen = 0;
let soundWarned = false;
// onDone always runs once: when speech ends, fails, or is unavailable.
function speak(text, onDone) {
  let done = false;
  const finish = () => { if (!done) { done = true; onDone && onDone(); } };
  if (!canSpeak) return finish();
  const gen = ++speakGen;
  let started = false;
  try {
    const u = new SpeechSynthesisUtterance(text.replace(/["!]/g, ' '));
    u.lang = 'ko-KR';
    if (koVoice) u.voice = koVoice;
    u.rate = 0.95;
    u.pitch = 1.1;
    u.onstart = () => { started = true; };
    u.onend = u.onerror = finish;
    window.__utterance = u; // keeps Chrome from garbage-collecting it mid-speech
    const go = () => { if (gen !== speakGen) return finish(); speechSynthesis.resume(); speechSynthesis.speak(u); };
    // Safari drops an utterance queued right after cancel(), so only cancel when something is playing.
    if (speechSynthesis.speaking || speechSynthesis.pending) {
      speechSynthesis.cancel();
      setTimeout(go, 150);
    } else {
      go();
    }
  } catch (e) {
    return finish();
  }
  setTimeout(() => {
    if (gen === speakGen && !started && !soundWarned) {
      soundWarned = true;
      toast('🔇 소리가 안 들리면 무음 모드와 볼륨을 확인해 주세요');
    }
  }, 3000);
  setTimeout(finish, 8000);
}

const $ = id => document.getElementById(id);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function hasBatchim(word) {
  const c = word.charCodeAt(word.length - 1);
  return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0;
}

function clueFor(item, level) {
  const [, name, desc, riddle] = item;
  if (level === 'name') return `${name}${hasBatchim(name) ? '을' : '를'} 찾아봐!`;
  return level === 'desc' ? desc : riddle;
}

function startStage(i) {
  stageIdx = i;
  const st = STAGES[i];
  document.body.style.setProperty('--bg', st.bg);
  $('stageLabel').textContent = `${i + 1}단계 ${st.name}`;
  clueIdx = 0; misses = 0; missesThisClue = 0; hints = 3; busy = false; stagePrizes = [];
  $('hintLeft').textContent = hints;
  $('hintBtn').disabled = false;

  const items = shuffle([...POOLS[st.pool]]).slice(0, st.cols * st.rows);
  targets = shuffle(items.map((_, k) => k)).slice(0, st.boxes);
  const grid = $('grid');
  grid.innerHTML = '';
  tiles = items.map((item, k) => {
    const el = document.createElement('div');
    el.className = 'tile';
    el.innerHTML = `<div class="under">${BOX}</div><div class="cover">${item[0]}</div>`;
    el.addEventListener('click', () => tapTile(k));
    grid.appendChild(el);
    return { el, item, done: false };
  });
  renderSlots();
  layout();
  showClue();
}

function showClue() {
  missesThisClue = 0;
  const text = clueFor(tiles[targets[clueIdx]].item, STAGES[stageIdx].level);
  $('clueText').textContent = text;
  const card = $('clue');
  card.classList.remove('new');
  void card.offsetWidth;
  card.classList.add('new');
  speak(text);
}

function layout() {
  const st = STAGES[stageIdx];
  const field = $('field');
  const gap = 10;
  const w = field.clientWidth, h = field.clientHeight;
  const cell = Math.floor(Math.min((w - gap * (st.cols - 1)) / st.cols, (h - gap * (st.rows - 1)) / st.rows, 120));
  const grid = $('grid');
  grid.style.setProperty('--cell', cell + 'px');
  grid.style.gridTemplateColumns = `repeat(${st.cols}, ${cell}px)`;
  grid.style.gridAutoRows = cell + 'px';
}

function renderSlots() {
  const st = STAGES[stageIdx];
  let html = '';
  for (let k = 0; k < st.boxes; k++) html += k < clueIdx ? BOX : `<span class="slot-empty">${BOX}</span>`;
  $('slots').innerHTML = html;
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function tapTile(k) {
  const t = tiles[k];
  if (busy || t.done) return;
  if (k === targets[clueIdx]) return found(t);

  misses++;
  missesThisClue++;
  t.el.classList.remove('wrong');
  void t.el.offsetWidth;
  t.el.classList.add('wrong');
  beep([280, 220], 0.1, 'square');
  const name = t.item[1];
  const msg = `그건 ${name}${hasBatchim(name) ? '이야' : '야'}. 다시 찾아봐!`;
  toast(msg);
  speak(msg);
  if (missesThisClue >= 2) tiles[targets[clueIdx]].el.classList.add('glow');
}

function found(t) {
  busy = true;
  t.done = true;
  t.el.classList.remove('glow', 'hinting');
  t.el.classList.add('open', 'box');
  beep([660, 880, 1320], 0.1, 'triangle');
  burst(t.el);
  const name = t.item[1];
  let waits = 2;
  const next = () => { if (--waits === 0 && clueIdx < STAGES[stageIdx].boxes) { busy = false; showClue(); } };
  speak(`딩동댕! ${name}${hasBatchim(name) ? '이었어' : '였어'}! 상자 발견!`, next);
  setTimeout(next, 1900);
  const prize = pick(PRIZES);
  stagePrizes.push(prize);
  save.treasure.push(prize);
  setTimeout(() => { t.el.querySelector('.under').textContent = prize; }, 800);
  clueIdx++;
  renderSlots();
  updateTreasureCount();

  if (clueIdx === STAGES[stageIdx].boxes) {
    save.stage = Math.min(stageIdx + 1, STAGES.length - 1);
    writeSave();
    $('hintBtn').disabled = true;
    setTimeout(showClear, 1600);
  } else {
    writeSave();
  }
}

function burst(el) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const bits = ['✨','⭐','🌟','💛'];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = pick(bits);
    const a = (Math.PI * 2 * i) / 10, d = 60 + Math.random() * 50;
    s.style.left = (cx - 11) + 'px';
    s.style.top = (cy - 11) + 'px';
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}

function useHint() {
  if (hints <= 0 || busy) return;
  hints--;
  $('hintLeft').textContent = hints;
  if (hints === 0) $('hintBtn').disabled = true;
  const el = tiles[targets[clueIdx]].el;
  el.classList.remove('hinting');
  void el.offsetWidth;
  el.classList.add('hinting');
  setTimeout(() => el.classList.remove('hinting'), 1600);
  beep([520, 620], 0.1);
}

function showClear() {
  const st = STAGES[stageIdx];
  const stars = misses <= 1 ? 3 : misses <= 3 ? 2 : 1;
  $('stars').innerHTML = [1, 2, 3].map(n => `<span class="${n <= stars ? '' : 'off'}">⭐</span>`).join('');
  $('prizes').textContent = stagePrizes.join(' ');
  const last = stageIdx === STAGES.length - 1;
  const missText = misses === 0 ? '한 번도 안 틀렸어요! 대단해요!' : `${misses}번 틀렸지만 끝까지 찾았어요!`;
  if (last) {
    $('clearEmoji').textContent = '🏆';
    $('clearTitle').textContent = '모든 상자를 찾았어요!';
    $('clearText').innerHTML = `최고의 수수께끼 탐정이에요! 👑<br>보물 가방에 선물이 <b>${save.treasure.length}개</b> 있어요.`;
    $('nextBtn').textContent = '처음부터 다시 🔄';
    beep([523, 659, 784, 1047, 1319], 0.18, 'triangle');
    speak('모든 상자를 찾았어! 최고의 수수께끼 탐정이야!');
  } else {
    $('clearEmoji').textContent = '🎉';
    $('clearTitle').textContent = `${st.name} 상자를 다 찾았어요!`;
    $('clearText').textContent = `${missText} 상자에서 나온 선물:`;
    $('nextBtn').textContent = `다음: ${STAGES[stageIdx + 1].name} ▶`;
    beep([523, 659, 784, 1047], 0.15, 'triangle');
  }
  $('clearOverlay').classList.add('show');
}

function updateTreasureCount() {
  $('treasureCount').textContent = save.treasure.length;
}

$('startBtn').addEventListener('click', () => {
  $('startOverlay').classList.remove('show');
  startStage(save.stage);
});
$('fromStartBtn').addEventListener('click', () => {
  save.stage = 0;
  writeSave();
  $('startOverlay').classList.remove('show');
  startStage(0);
});
$('nextBtn').addEventListener('click', () => {
  $('clearOverlay').classList.remove('show');
  const next = stageIdx === STAGES.length - 1 ? 0 : stageIdx + 1;
  save.stage = next;
  writeSave();
  startStage(next);
});
$('hintBtn').addEventListener('click', useHint);
$('speakBtn').addEventListener('click', () => speak($('clueText').textContent));
$('clue').addEventListener('click', e => { if (e.target !== $('speakBtn')) speak($('clueText').textContent); });
if (!canSpeak) $('speakBtn').style.display = 'none';
$('treasureBtn').addEventListener('click', () => {
  $('collection').innerHTML = save.treasure.length
    ? save.treasure.join(' ')
    : '<span class="small">아직 비어 있어요.<br>상자를 찾으면 선물이 들어와요!</span>';
  $('treasureOverlay').classList.add('show');
});
$('closeTreasure').addEventListener('click', () => $('treasureOverlay').classList.remove('show'));
window.addEventListener('resize', layout);

updateTreasureCount();
if (save.stage > 0) {
  $('startBtn').textContent = `${save.stage + 1}단계부터 계속하기`;
  $('resumeWrap').style.display = 'block';
}
stageIdx = save.stage;
document.body.style.setProperty('--bg', STAGES[stageIdx].bg);
$('stageLabel').textContent = `${stageIdx + 1}단계 ${STAGES[stageIdx].name}`;
$('startOverlay').classList.add('show');
</script>
</body>
</html>
