<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Mini Adventure</title>
<style>
  :root{
    --sky:#aee7f8; --grass:#b9e98c; --panel:#fffdf3; --ink:#2b3a55;
    --red:#e8484f; --yellow:#ffc93c; --green:#58b368; --blue:#4a9fe0;
    --purple:#8e5bd6; --soft:#ffe9b0; --shadow:0 6px 0 rgba(43,58,85,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Comic Sans MS','Chalkboard SE','Comic Neue',sans-serif;
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky) 45%,var(--grass) 100%);
    min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
    color:var(--ink); padding:16px 10px 40px;
  }
  #app{width:100%; max-width:430px;}
  .card{
    background:var(--panel); border:4px solid var(--ink); border-radius:22px;
    padding:18px; box-shadow:var(--shadow); margin-bottom:14px;
  }
  h1{font-size:29px; margin:4px 0 2px; text-align:center; letter-spacing:-.5px;}
  h2{font-size:21px; margin:0 0 10px;}
  .sub{text-align:center; color:#6b7a99; font-weight:700; margin:0 0 14px; font-size:14px;}
  button{
    font-family:inherit; font-size:17px; font-weight:800; color:var(--ink);
    background:#fff; border:3px solid var(--ink); border-radius:16px;
    padding:13px 14px; cursor:pointer; box-shadow:0 4px 0 rgba(43,58,85,.2);
    transition:transform .05s;
  }
  button:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(43,58,85,.2);}
  button:disabled{opacity:.45; cursor:default;}
  button.big{width:100%; font-size:19px; padding:16px;}
  button.red{background:var(--red); color:#fff;}
  button.yellow{background:var(--yellow);}
  button.green{background:var(--green); color:#fff;}
  button.blue{background:var(--blue); color:#fff;}
  button.purple{background:var(--purple); color:#fff;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .row{display:flex; gap:10px; align-items:center;}
  .spacer{flex:1;}
  .mon-big{font-size:72px; text-align:center; line-height:1.1; filter:drop-shadow(0 4px 0 rgba(43,58,85,.15));}
  .sprite{image-rendering:pixelated; vertical-align:middle; display:inline-block;}
  .gmax-glow{filter:drop-shadow(0 0 12px #ff3b3b) drop-shadow(0 0 24px rgba(255,59,59,.5));}
  .silhouette{filter:brightness(0) opacity(.4);}
  .bounce{display:inline-block; animation:bounce 1.6s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .shakeit{animation:shake .45s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .flashit{animation:flash .5s 3;}
  @keyframes flash{0%,100%{filter:brightness(1)}50%{filter:brightness(3) saturate(0)}}
  .hpbar{height:14px; background:#e3e0d2; border:2px solid var(--ink); border-radius:99px; overflow:hidden;}
  .hpfill{height:100%; border-radius:99px; transition:width .4s;}
  .tag{display:inline-block; font-size:12px; font-weight:800; padding:2px 9px; border-radius:99px; border:2px solid var(--ink); background:var(--soft);}
  .st-tag{background:#ffd9d9; padding:2px 7px; font-size:11px;}
  /* move names can be long once the ⏩ / status hints are added — keep them on one line */
  .move-btn{font-size:15px; padding:13px 6px; line-height:1.2;}
  .gaugebar{height:10px; background:#e3e0d2; border:2px solid var(--ink); border-radius:99px; overflow:hidden; flex:1;}
  .gaugefill{height:100%; border-radius:99px; transition:width .35s;}
  .gauge-full{animation:gaugepulse 1s ease-in-out infinite;}
  @keyframes gaugepulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
  .trainer-line{font-size:13px; font-weight:800; color:#6b7a99;}
  .msgbox{
    background:#fff; border:3px solid var(--ink); border-radius:14px;
    padding:12px 14px; font-weight:800; font-size:16px; min-height:52px;
    display:flex; align-items:center;
  }
  .party-item{
    display:flex; align-items:center; gap:10px; background:#fff;
    border:3px solid var(--ink); border-radius:16px; padding:10px 12px;
  }
  .party-item.active-mon{background:var(--soft);}
  .party-item .info{flex:1;}
  .party-item .nm{font-weight:800; font-size:16px;}
  .party-item .lv{font-size:13px; color:#6b7a99; font-weight:800;}
  .ball-count{font-weight:800; font-size:15px;}
  .progress-note{font-size:13px; font-weight:800; color:#6b7a99; margin-top:4px;}
  .center{text-align:center;}
  .evo-stage{font-size:80px; text-align:center; margin:20px 0;}
  .dex-cell{background:#fff; border:2px solid var(--ink); border-radius:12px; padding:6px 2px; text-align:center;}
  .dex-cell .dn{font-size:10px; font-weight:800; margin-top:2px;}
  .dex-family{display:flex; align-items:center; gap:4px; background:#fff; border:2px solid var(--ink); border-radius:12px; padding:6px 8px; flex-wrap:wrap;}
  .dex-node{text-align:center; min-width:54px;}
  .dex-node .dn{font-size:9px; font-weight:800; margin-top:1px;}
  .dnum{font-size:9px; font-weight:800; color:#9aa5bb; font-variant-numeric:tabular-nums; line-height:1.2;}
  .dex-branch{display:flex; flex-direction:column; gap:2px;}
  .dex-mega{border:2px dashed var(--purple); border-radius:10px; padding:2px 4px; background:#f6f0ff;}
  .dex-arrow{font-weight:800; font-size:16px; color:#6b7a99;}
  .fx-particle{position:fixed; font-size:26px; z-index:50; pointer-events:none; line-height:1;}
  .fx-ring{position:fixed; width:60px; height:60px; border:4px solid #fff; border-radius:50%; z-index:49; pointer-events:none;}
  .confetti{position:fixed; top:-20px; font-size:22px; animation:fall linear forwards; z-index:5; pointer-events:none;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}
  .starter-btn{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 6px;}
  .code-box{width:100%; min-height:110px; font-family:monospace; font-size:12px; border:3px solid var(--ink); border-radius:12px; padding:10px; word-break:break-all;}
  .fadein{animation:fadein .35s;}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){
    .bounce,.shakeit,.flashit,.confetti,.fadein,.gauge-full{animation:none !important;}
  }
  /* tablets (iPad): scale the whole game up so it fills the screen */
  @media (min-width: 700px){
    #app{ zoom: 1.5; }
    .fx-particle{ font-size: 38px; }
    .confetti{ font-size: 32px; }
  }
  @media (min-width: 1000px){
    #app{ zoom: 1.8; }
  }
</style>

</head>

const BOX_MAX = 40;
const slotKey = s => 'pk-slot-'+s;
function sanitizeSave(g){
  if(!g || !g.party || !g.party.length) return null;
  if(!g.badges) g.badges = [];
  g.badges = g.badges.map(b => OLD_BADGE_MAP[b] || b);
  g.party = g.party.filter(m => m && SPECIES[m.id]).slice(0,6);
  /* saves from before the Storage Box existed simply have no box */
  g.box = (Array.isArray(g.box) ? g.box : []).filter(m => m && SPECIES[m.id]).slice(0,BOX_MAX);
  g.dex = (g.dex||[]).filter(id => SPECIES[id]);
  if(!g.party.length) return null;
  /* battle-only flags never belong in a save file */
  g.party.concat(g.box).forEach(m => {
    delete m.mega; delete m.gmax; delete m.tf; delete m.st; delete m.stT; delete m.bossMaxHp;
    m.lv = Math.max(1, Math.min(100, Math.round(m.lv || 1)));
    m.exp = Math.max(0, Math.round(m.exp || 0));
    const mh = maxHpOf(m);
    m.hp = Math.max(0, Math.min(mh, Math.round(m.hp == null ? mh : m.hp)));
  });
  g.box.forEach(m => { m.hp = maxHpOf(m); }); // the box always keeps them healthy
  return g;
}
function loadSlot(s){
  try{
    const d = localStorage.getItem(slotKey(s));
    if(d) return sanitizeSave(JSON.parse(d));
  }catch(e){}
  return null;
}
function save(){
  try{ localStorage.setItem(slotKey(SLOT), JSON.stringify(G)); }catch(e){}
}
/* share codes: copy your save between devices */
function makeCode(g){
  return 'PK1.' + btoa(unescape(encodeURIComponent(JSON.stringify(g))));
}
function parseCode(str){
  try{
    str = (str||'').trim();
    if(!str.startsWith('PK1.')) return null;
    return sanitizeSave(JSON.parse(decodeURIComponent(escape(atob(str.slice(4))))));
  }catch(e){ return null; }
}

function newMon(speciesId, lv){
  const s = SPECIES[speciesId];
  const maxHp = s.hp + lv*2;
  return {id:speciesId, lv, exp:0, hp:maxHp};
}
/* formOf = the shape a Pokémon is fighting AS right now.
   Normally its own species — but a transformed Ditto borrows someone else's (m.tf). */
function formOf(m){ return (m && m.tf && SPECIES[m.tf]) ? SPECIES[m.tf] : SPECIES[m.id]; }
function maxHpOf(m){ return SPECIES[m.id].hp + m.lv*2; } // HP is always your own, even transformed
function atkOf(m){ return formOf(m).atk + Math.floor(m.lv/2); }
function baseDefOf(m){ return formOf(m).def; }
function defOf(m){ return m.mega ? Math.round(baseDefOf(m)*1.3) : baseDefOf(m); }
function spdOf(m){
  let s = formOf(m).spd;
  if(m.st==='par') s *= 0.5;   // paralysis halves speed
  return s;
}
/* an average-defence Pokémon takes exactly 1.0x — tanks less, glass cannons more.
   The band is deliberately gentle (0.80x ~ 1.20x): wide enough that Onix feels like a
   wall and Alakazam feels like paper, narrow enough that the game's overall difficulty
   is unchanged (measured against the pre-defence build, gym by gym). */
function defFactor(m){
  const f = (AVG_DEF*4) / (AVG_DEF*3 + defOf(m));
  return Math.max(0.80, Math.min(1.20, f));
}
function burnMult(m){ return m.st==='brn' ? 0.75 : 1; } // burned Pokémon hit softer
function expNeed(m){ return m.lv*12; }
function activeMon(){ return G.party.find(m=>m.hp>0) || G.party[0]; }
function boxOf(){ if(!G.box) G.box = []; return G.box; }

function clearStatus(m){ delete m.st; delete m.stT; }
function statusImmune(m, st){
  return st==='brn' && formOf(m).type==='Fire'; // fire types shrug off burns
}
function applyStatus(m, st){
  if(!STATUS[st] || m.st || statusImmune(m, st)) return false;
  m.st = st;
  if(st==='slp') m.stT = 2 + rand(2); // asleep for 2~3 turns
  return true;
}

let AC = null;
function beep(freq, dur, type='square', vol=.15){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}

const BGM = {
  enabled: true, name: null, timer: null, step: 0,
  load(){ try{ this.enabled = localStorage.getItem('bgm-off') !== '1'; }catch(e){} },
  freq(n){ return 440*Math.pow(2,(n-69)/12); },
  play(name){
    if(this.name === name && this.timer) return;
    this.stop();
    this.name = name;
    if(!this.enabled) return;
    const t = BGM_THEMES[name];
    if(!t) return;
    this.step = 0;
    this.timer = setInterval(()=>{
      const lead = t.lead[this.step % t.lead.length];
      const bass = t.bass[this.step % t.bass.length];
      if(lead) beep(this.freq(lead), t.beat/1000*0.9, 'square', .045);
      if(bass) beep(this.freq(bass), t.beat/1000*0.9, 'triangle', .06);
      this.step++;
    }, t.beat);
  },
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer = null; } this.name = null; },
  toggle(){
    this.enabled = !this.enabled;
    try{ localStorage.setItem('bgm-off', this.enabled ? '0' : '1'); }catch(e){}
    if(!this.enabled) this.stop();
    return this.enabled;
  },
};
BGM.load();
window.toggleBgm = function(){ BGM.toggle(); renderTown(); };

function spriteImg(key, size){
  const src = SPRITES[key];
  const sp = SPECIES[key];
  if(!src) return `<span style="font-size:${size*0.8}px">${sp ? sp.emoji : '✨'}</span>`;
  return `<img class="sprite" src="${src}" alt="${sp ? sp.name : key}" style="width:${size}px;height:${size}px;">`;
}

/* ============ SCREEN: TITLE + SAVE SLOTS ============ */
function renderTitle(){
  const slots = [1,2,3].map(s => ({s, g: loadSlot(s)}));
  app.innerHTML = `
  <div class="card fadein center">
    <div class="mon-big"><span class="bounce">${spriteImg('pikachu',84)}</span> <span class="bounce" style="animation-delay:.3s">${spriteImg('pairi',84)}</span> <span class="bounce" style="animation-delay:.6s">${spriteImg('kkobugi',84)}</span></div>
    <h1>Pocket Mini Adventure</h1>
    <p class="sub">Explore 8 lands! Fill your Pokédex with ${TOTAL_KINDS} kinds!<br>Mega Evolve 💠 Dynamax 🔴 and catch <b>Mega Mewtwo X</b>!</p>
    <div class="stack">
      ${slots.map(({s,g})=>{
        if(g){
          const lead = g.party[0];
          return `<div class="row">
            <button class="big green" style="flex:1;" onclick="playSlot(${s})">
              ▶ Slot ${s} — ${SPECIES[lead.id].name} Lv.${lead.lv}<br><small>🏅 ${g.badges.length}/5 · 📖 ${g.dex.length}/${TOTAL_KINDS}</small>
            </button>
            <button style="padding:10px;" onclick="exportSlot(${s})" title="Share code">📤</button>
            <button style="padding:10px;" onclick="deleteSlot(${s})" title="Delete">🗑️</button>
          </div>`;
        }
        return `<div class="row">
          <button class="big yellow" style="flex:1;" onclick="playSlot(${s})">✨ Slot ${s} — New Game</button>
          <button style="padding:10px;" onclick="importSlot(${s})" title="Enter code">📥</button>
        </div>`;
      }).join('')}

window.renderDex = function(){
  sfx.tap();
  const targets = new Set();
  Object.values(SPECIES).forEach(s=>{
    if(s.evolveTo) (Array.isArray(s.evolveTo)?s.evolveTo:[s.evolveTo]).forEach(t=>targets.add(t));
  });
  const node = (id, small) => {
    const got = G.dex.includes(id);
    const s = SPECIES[id];
    return `<div class="dex-node">
      <div class="dnum">${dexNum(id)}</div>
      ${got ? spriteImg(id, small?38:44) : `<span class="silhouette">${spriteImg(id, small?38:44)}</span>`}
      <div class="dn" style="${got?'':'color:#9aa5bb;'}">${got ? s.name : '???'}</div>
    </div>`;
  };
  const megaNode = (id) => {
    const got = G.dex.includes(id);
    const m = MEGA[id];
    return `<div class="dex-node dex-mega">
      <div class="dnum" style="color:var(--purple);">${dexNum(id)}💠</div>
      ${got ? spriteImg(m.sprite, 44) : `<span class="silhouette">${spriteImg(m.sprite, 44)}</span>`}
      <div class="dn" style="color:var(--purple);">${got ? m.name : '???'}</div>
    </div>`;
  };
  const arrow = t => `<span class="dex-arrow">${t||'➜'}</span>`;
  const families = [], solos = [];
  Object.keys(SPECIES).forEach(base=>{
    if(targets.has(base)) return;
    const stages = [[base]];
    let cur = base;
    while(true){
      const to = SPECIES[cur].evolveTo;
      if(!to) break;
      if(Array.isArray(to)){ stages.push(to); break; }
      stages.push([to]); cur = to;
    }
    const finalIds = stages[stages.length-1];
    const megaId = finalIds.find(id=>MEGA[id]);
    if(stages.length===1 && !megaId){ solos.push(base); return; }
    let row = stages.map(stage =>
      stage.length===1 ? node(stage[0]) : `<div class="dex-branch">${stage.map(id=>node(id,true)).join('')}</div>`
    ).join(arrow());
    if(megaId) row += arrow('💠') + megaNode(megaId);
    families.push(`<div class="dex-family">${row}</div>`);
  });
  app.innerHTML = `
  <div class="card fadein">
    <h2>📖 Pokédex <small style="color:#6b7a99">(${G.dex.length}/${TOTAL_KINDS})</small></h2>
    <p class="sub" style="text-align:left;">➜ shows who they grow into! 💠 is the special MEGA battle form!</p>
    <div class="stack" style="gap:8px;">${families.join('')}</div>
    <h2 style="margin-top:16px;">⭐ One-of-a-kind</h2>
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">
      ${solos.map(id=>`<div class="dex-cell"><div class="dnum">${dexNum(id)}</div>${G.dex.includes(id) ? spriteImg(id,44) : `<span class="silhouette">${spriteImg(id,44)}</span>`}<div class="dn" style="${G.dex.includes(id)?'':'color:#9aa5bb;'}">${G.dex.includes(id) ? SPECIES[id].name : '???'}</div></div>`).join('')}
    </div>
    <div style="margin-top:14px;"><button class="big" onclick="backTown()">⬅ Back to Town</button></div>
  </div>`;
};

window.goArea = function(i){
  sfx.tap();
  const ar = AREAS[i];
  if(G.badges.length < ar.need) return;
  if(activeMon().hp===0){ renderTown('Your Pokémon are all tired! Heal them first. 🏥'); return; }
  const myMax = Math.max(...G.party.map(m=>m.lv));
  let lv = Math.min(45, Math.max(ar.min, myMax - 2 + rand(4))); // wilds grow with YOU!
  let id, rare = false;
  if(ar.rare.length && Math.random() < 0.06){
    id = ar.rare[rand(ar.rare.length)]; rare = true; lv += 2;
  }else{
    id = ar.pool[rand(ar.pool.length)];
    let s = SPECIES[id];
    while(s.evolveLv && lv >= s.evolveLv + 2 && Math.random() < 0.6){
      let to = s.evolveTo; if(Array.isArray(to)) to = to[rand(to.length)];
      id = to; s = SPECIES[id];
    }
  }
  B = newBattle({enemy:newMon(id, lv), trainer:null, cave:null, legend:false, queue:[]});
  BGM.play(rare ? 'boss' : 'battle');
  renderBattle((rare
    ? `🌟 WOW!! A legendary <b>${SPECIES[id].name}</b> appeared!!`
    : `Look! A wild <b>${SPECIES[id].name}</b> is here!`) + dittoPrep());
  if(rare) sfx.power(); else sfx.tap();
};
window.goPlaza = function(){
  sfx.tap();
  if(G.badges.length < 1) return;
  if(activeMon().hp===0){ renderTown('Your Pokémon are all tired! Heal them first. 🏥'); return; }
  const tr = PLAZA[rand(PLAZA.length)];
  const myMax = Math.max(...G.party.map(m=>m.lv));
  const n = 2 + (G.badges.length>=2?1:0) + (G.badges.length>=4?1:0);
  const base = Object.keys(SPECIES).filter(id => id!=='mewtwoX' && !LEGENDS.includes(id) && !EVOLVED.has(id) && (tr.type==='Any' || SPECIES[id].type===tr.type));
  const queue = [];
  for(let k=0;k<n;k++){
    let lv = Math.min(45, Math.max(4, myMax - 1 + rand(4)));
    let id = base[rand(base.length)];
    let s = SPECIES[id];
    while(s.evolveLv && lv >= s.evolveLv){
      let to = s.evolveTo; if(Array.isArray(to)) to = to[rand(to.length)];
      id = to; s = SPECIES[id];
    }
    queue.push(makeTrainerMon(id, lv));
  }
  B = newBattle({enemy:queue.shift(), trainer:tr, cave:null, legend:false, plaza:true, queue});
  BGM.play('boss');
  renderBattle(`${tr.avatar} ${tr.trainer} wants to battle! "Go, <b>${SPECIES[B.enemy.id].name}</b>!"` + dittoPrep());
  sfx.fail();
};
/* fresh battle state — ⚡power gauge starts empty, so Mega/Dynamax must be earned */
function newBattle(o){
  return Object.assign({queue:[], powerUsed:false, over:false, gauge:0, enemyMega:false, forced:false}, o);
}
function makeTrainerMon(id, lv){
  const m = newMon(id, lv);
  m.bossMaxHp = Math.round(maxHpOf(m)*1.2); // trainer Pokémon are extra tough
  m.hp = m.bossMaxHp;
  return m;
}
window.goCave = function(i){
  sfx.tap();
  const c = CAVES[i];
  if(activeMon().hp===0){ renderTown('Your Pokémon are all tired! Heal them first. 🏥'); return; }
  const queue = c.team.map(([id,lv]) => makeTrainerMon(id, lv));
  B = newBattle({enemy:queue.shift(), trainer:c, cave:c, legend:false, queue});
  BGM.play('boss');
  renderBattle(`${c.avatar} ${c.trainer} wants to battle! "Go, <b>${SPECIES[B.enemy.id].name}</b>!"` + dittoPrep());
  sfx.fail();
};
window.goBoss = function(){
  sfx.tap();
  if(activeMon().hp===0){ renderTown('Your Pokémon are all tired! Heal them first. 🏥'); return; }
  if(!G.masterBall){
    G.masterBall = true; save();
    renderTown('You found a shiny <b>Master Ball</b>! 🟣 It can catch ANY Pokémon! Tap the cave again to go in!');
    return;
  }
  const queue = LEGEND.team.map(([id,lv]) => makeTrainerMon(id, lv));
  const mw = newMon('mewtwoX', 24);
  mw.bossMaxHp = 200; mw.hp = 200;
  queue.push(mw);
  B = newBattle({enemy:queue.shift(), trainer:LEGEND, cave:null, legend:true, queue});
  BGM.play('boss');
  renderBattle(`${LEGEND.avatar} ${LEGEND.trainer} wants to battle! "Go, <b>${SPECIES[B.enemy.id].name}</b>!"` + dittoPrep());
  sfx.fail();
};
function bossMaxHpOf(m){ return m.bossMaxHp || maxHpOf(m); }
function isCatchPhase(){ return B.legend && B.enemy.id==='mewtwoX' && !G.bossCaught; }

/* ============ DITTO: TRANSFORM ============
   Ditto copies whoever it faces — looks, type, moves, atk/def/spd. HP stays its own.
   Runs when a battle starts, when a new Pokémon is sent out, and clears on the way out. */
function dittoPrep(){
  const my = activeMon(), e = B.enemy;
  let note = '';
  if(my.id==='ditto' && e.id!=='ditto'){
    my.tf = e.tf || e.id;
    note += ` Your Ditto TRANSFORMED into <b>${SPECIES[my.tf].name}</b>! ✨`;
  }
  if(e.id==='ditto' && my.id!=='ditto'){
    e.tf = my.tf || my.id;
    note += ` The Ditto TRANSFORMED into <b>${SPECIES[e.tf].name}</b>! ✨`;
  }
  return note;
}

/* ===== Mega Evolution & Dynamax ===== */
/* the ⚡power gauge fills as you fight: +18 attacking, +12 taking a hit.
   A short wild scrap almost never reaches 100 — gym and champion battles do. */
const GAUGE_MAX = 100;
function addGauge(n){
  if(!B || B.over) return;
  B.gauge = Math.min(GAUGE_MAX, (B.gauge||0) + n);
}
function gaugeReady(){ return (B.gauge||0) >= GAUGE_MAX; }
function powerUnlocked(){ return G.badges.length >= 3; }
function canMega(){
  if(!B || B.over || B.powerUsed || !gaugeReady()) return false;
  const my = activeMon();
  return G.badges.length >= 3 && !!MEGA[my.id] && !my.tf && !my.mega && !my.gmax;
}
function canGmax(){
  if(!B || B.over || B.powerUsed || !gaugeReady()) return false;
  const my = activeMon();
  return G.badges.length >= 5 && SPECIES[my.id].evolveLv === null && !my.mega && !my.gmax;
}
/* wipe everything that only exists inside a battle */
function clearBattleFlags(){
  G.party.forEach(m => { delete m.mega; delete m.gmax; delete m.tf; clearStatus(m); });
}
function powerMult(m){ return m.mega ? 1.4 : (m.gmax ? 1.7 : 1); }
window.doMega = async function(){
  if(busy || !canMega()) return; busy = true; setBtns(false);
  const my = activeMon();
  my.mega = true;
  B.powerUsed = true;
  B.gauge = 0;
  sfx.power();
  setMsg(`${SPECIES[my.id].name}'s Mega Bracelet is shining! 💠`);
  flashEl('my-sprite');
  await ringBurstFx('my-sprite','💠');
  await ringBurstFx('my-sprite','✨');
  renderBattle(`⚡ MEGA EVOLUTION! ⚡ It became <b>${MEGA[my.id].name}</b>! Attack AND defence up!`);
  shakeScreen();
  busy = false; setBtns(true);
};
window.doGmax = async function(){
  if(busy || !canGmax()) return; busy = true; setBtns(false);
  const my = activeMon();
  my.gmax = 3;
  B.powerUsed = true;
  B.gauge = 0;
  const healed = Math.min(maxHpOf(my) - my.hp, Math.round(maxHpOf(my)*0.25));
  my.hp += healed;
  sfx.power();
  setMsg(`${SPECIES[my.id].name} is getting HUGE! 🔴☁️`);
  flashEl('my-sprite');
  await ringBurstFx('my-sprite','🔴');
  await ringBurstFx('my-sprite','☁️');
  renderBattle(`🔴 DYNAMAX! 🔴 <b>G-Max ${SPECIES[my.id].name}</b> is GIANT for 3 moves!${healed>0?` It got ${healed} HP back! 💗`:''}`);
  shakeScreen();
  busy = false; setBtns(true);
};
/* the enemy trainer's LAST Pokémon fights back with a Mega of its own (once, below 55% HP).
   Mega Mewtwo X waits at the end of the Champion's queue but isn't part of the team,
   so Blastoise still counts as the last one. */
async function maybeEnemyMega(){
  const e = B.enemy;
  const behind = B.queue.filter(m => m.id !== 'mewtwoX').length;
  if(!B.trainer || behind || B.enemyMega) return false;
  if(!MEGA[e.id] || e.tf || e.mega) return false;
  if(e.hp <= 0 || e.hp > bossMaxHpOf(e)*0.55) return false;
  B.enemyMega = true;
  e.mega = true;
  sfx.power();
  setMsg(`${B.trainer.trainer}: "Now! Show them our REAL power!" 💠`);
  flashEl('enemy-sprite');
  await ringBurstFx('enemy-sprite','💠');
  renderBattle(`💠 MEGA EVOLUTION! ${SPECIES[e.id].name} became <b>${MEGA[e.id].name}</b>!`);
  shakeScreen();
  await sleep(1300);
  return true;
}
function flashEl(id){
  const el = document.getElementById(id);
  if(el){ el.classList.remove('flashit'); void el.offsetWidth; el.classList.add('flashit'); }
}

function movesOf(m){
  return formOf(m).mv.map(n => Object.assign({name:n}, MOVES[n]));
}
function typeMult(moveType, defType){
  const t = TYPES[moveType];
  if(t.barely && t.barely.includes(defType)) return 0.4;
  if(t.strong.includes(defType)) return 1.5;
  if(t.weak.includes(defType)) return 0.7;
  return 1;
}

/* battle name + sprite, honouring Mega / Dynamax / a transformed Ditto */
function monLabel(m){
  if(m.mega && MEGA[m.id] && !m.tf) return MEGA[m.id].name;
  if(m.gmax) return 'G-Max ' + formOf(m).name;
  return formOf(m).name;
}
function monSprite(m, size){
  if(m.mega && MEGA[m.id] && !m.tf) return spriteImg(MEGA[m.id].sprite, Math.round(size*1.18));
  if(m.gmax) return `<span class="gmax-glow">${spriteImg(m.tf || m.id, Math.round(size*1.55))}</span>`;

}
function moveBtnLabel(mv){

  return `${mv.pri?'⏩':''}${tf} ${mv.name}${st}`;
}

      ${ballBtn}
      <button class="blue" ${canSwitch?'':'disabled'} onclick="openSwitch()">🔄 Switch</button>
      <button style="grid-column:1 / -1;" onclick="runAway()">💨 Run Away</button>

function setMsg(t){ const el=document.getElementById('battle-msg'); if(el) el.innerHTML='<span>'+t+'</span>'; }
function setBtns(on){
  document.querySelectorAll('#battle-btns button').forEach(b=>b.disabled=!on);
}
function shake(id){
  const el=document.getElementById(id);
  if(el){ el.classList.remove('shakeit'); void el.offsetWidth; el.classList.add('shakeit'); }
}

/* ===== attack effects ===== */
const noMotion = typeof matchMedia==='function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
function centerOf(id){
  const el = document.getElementById(id);
  if(!el || typeof el.getBoundingClientRect!=='function') return null;
  const r = el.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2};
}
function spawnFx(x, y, emoji, size){
  const s = document.createElement('span');
  s.className = 'fx-particle';
  s.textContent = emoji;
  if(size) s.style.fontSize = size+'px';
  s.style.left = (x-14)+'px'; s.style.top = (y-14)+'px';
  document.body.appendChild(s);
  return s;
}
function spawnRing(x, y, color){
  const s = document.createElement('span');
  s.className = 'fx-ring';
  s.style.left = (x-30)+'px'; s.style.top = (y-30)+'px';
  s.style.borderColor = color || '#fff';
  document.body.appendChild(s);
  if(s.animate) s.animate(
    [{transform:'scale(.2)', opacity:1},{transform:'scale(2.4)', opacity:0}],
    {duration:450, easing:'ease-out', fill:'forwards'});
  setTimeout(()=>s.remove(), 500);
}
function shakeScreen(){
  if(noMotion || !document.body.animate) return;
  document.body.animate(
    [{transform:'translate(0,0)'},{transform:'translate(-7px,4px)'},{transform:'translate(7px,-4px)'},{transform:'translate(-5px,2px)'},{transform:'translate(0,0)'}],
    {duration:320});
}
/* particles arc from attacker to target with spin & sparkle trail */
async function attackFx(fromId, toId, emoji){
  const a = centerOf(fromId), b = centerOf(toId);
  if(!a || !b || noMotion) return;
  const n = 10;
  for(let i=0;i<n;i++){
    const main = i % 3 !== 2; // every 3rd particle is a sparkle trail
    const s = spawnFx(a.x, a.y, main ? emoji : '✨', 18 + rand(16));
    const dx = b.x-a.x + (Math.random()*40-20);
    const dy = b.y-a.y + (Math.random()*40-20);
    const mx = dx/2 + (Math.random()*70-35);
    const my2 = dy/2 - 24 - rand(34);
    if(s.animate) s.animate(
      [{transform:'translate(0,0) scale(.5) rotate(0deg)', opacity:1},
       {transform:`translate(${mx}px,${my2}px) scale(1.05) rotate(180deg)`, opacity:1, offset:.5},
       {transform:`translate(${dx}px,${dy}px) scale(1.35) rotate(360deg)`, opacity:.9}],
      {duration:380, delay:i*45, easing:'ease-in', fill:'forwards'});
    setTimeout(()=>s.remove(), 480+i*45);
  }
  await sleep(380 + n*45);
}
/* impact pop + shockwave ring on the target */
function burst(atId, emoji, big){
  const c = centerOf(atId);
  if(!c || noMotion) return;
  spawnRing(c.x, c.y, big ? '#ffcf3c' : '#ffffff');
  const s = spawnFx(c.x, c.y, emoji, big ? 58 : 44);
  if(s.animate) s.animate(
    [{transform:'scale(.4)', opacity:1},{transform:`scale(${big?2.2:1.7})`, opacity:0}],
    {duration:big?520:420, easing:'ease-out', fill:'forwards'});
  setTimeout(()=>s.remove(), big?580:480);
}
/* 12 particles exploding outward in a circle (transforms, super hits) */
async function ringBurstFx(atId, emoji){
  const c = centerOf(atId);
  if(!c || noMotion) return;
  for(let i=0;i<12;i++){
    const ang = i/12 * Math.PI * 2;
    const s = spawnFx(c.x, c.y, emoji, 20 + rand(10));
    if(s.animate) s.animate(
      [{transform:'translate(0,0) scale(.5)', opacity:1},
       {transform:`translate(${Math.cos(ang)*78}px,${Math.sin(ang)*78}px) scale(1.35) rotate(${180+rand(180)}deg)`, opacity:0}],
      {duration:520, easing:'ease-out', fill:'forwards'});
    setTimeout(()=>s.remove(), 570);
  }
  await sleep(430);
}
/* body-slam lunge toward the other side */
async function lungeFx(fromId){
  const el = document.getElementById(fromId);
  if(!el || !el.animate || noMotion) return;
  const d = fromId==='my-sprite' ? {x:44,y:-30} : {x:-44,y:30};
  el.animate(
    [{transform:'translate(0,0)'},{transform:`translate(${d.x}px,${d.y}px)`,offset:.45},{transform:'translate(0,0)'}],
    {duration:300, easing:'ease-in-out'});
  await sleep(300);
}
/* ball arc from my side to the enemy */
async function ballFx(emoji){
  const a = centerOf('my-sprite'), b = centerOf('enemy-sprite');
  if(!a || !b || noMotion) return;
  const s = spawnFx(a.x, a.y, emoji, 30);
  if(s.animate) s.animate(
    [{transform:'translate(0,0) rotate(0deg)'},
     {transform:`translate(${(b.x-a.x)/2}px,${b.y-a.y-70}px) rotate(360deg)`, offset:.5},
     {transform:`translate(${b.x-a.x}px,${b.y-a.y}px) rotate(720deg)`}],
    {duration:550, easing:'ease-in', fill:'forwards'});
  setTimeout(()=>s.remove(), 600);
  await sleep(550);
}

/* ============ TURN ENGINE ============
   Both sides pick a move, then SPEED decides who swings first
   (a ⏩priority move like Quick Attack always jumps the queue).
   Every helper below returns true when it has taken over the flow
   (battle won/lost, a screen swapped in) so the caller stops. */
function pickEnemyMove(e){
  const mv = movesOf(e);
  return mv[rand(mv.length)];
}
function myGoesFirst(my, mv, e, emv){
  const pa = mv.pri || 0, pb = emv.pri || 0;
  if(pa !== pb) return pa > pb;
  const sa = spdOf(my), sb = spdOf(e);
  if(sa === sb) return Math.random() < 0.5;
  return sa > sb;
}
/* sleep / paralysis can keep a Pokémon from moving at all */
async function canAct(m){
  if(m.st==='slp'){
    if(m.stT > 0){
      m.stT--;
      setMsg(`${monLabel(m)} is fast asleep... 😴`);
      await sleep(950);
      return false;
    }
    clearStatus(m);
    renderBattle(`${monLabel(m)} woke up! 🌞`);
    await sleep(900);
  }
  if(m.st==='par' && Math.random() < 0.25){
    setMsg(`${monLabel(m)} is all zappy and can't move! ⚡`);
    await sleep(950);
    return false;
  }
  return true;
}
async function landStatus(mv, target, targetSprite){
  if(!mv.st || target.hp<=0 || !(Math.random() < (mv.stc||0))) return;
  if(!applyStatus(target, mv.st)) return;
  sfx.power();
  burst(targetSprite, STATUS[mv.st].icon);
  renderBattle(`${monLabel(target)} ${STATUS[mv.st].got} ${STATUS[mv.st].icon}`);
  await sleep(1050);
}

window.useMove = async function(i){
  if(busy||B.over) return; busy=true; setBtns(false);
  const my = activeMon();
  const mv = movesOf(my)[i];
  const emv = pickEnemyMove(B.enemy);
  if(myGoesFirst(my, mv, B.enemy, emv)){
    if(await myAction(mv)) return;
    if(await enemyAction(emv)) return;
  }else{
    if(await enemyAction(emv)) return;
    if(await myAction(mv)) return;
  }
  if(await endOfTurn()) return;
  busy=false; setBtns(true);
};

async function myAction(mv){
  const my = activeMon(), e = B.enemy;
  const usedGmaxTurn = !!my.gmax;
  if(!await canAct(my)){
    await tickGmax(my, usedGmaxTurn);
    return false;
  }
  setMsg(`${monLabel(my)} used ${mv.name}!`);
  await sleep(400);
  if(Math.random() > mv.acc){
    sfx.fail(); setMsg('Oops, it missed! 😅');
    await sleep(800);
    await tickGmax(my, usedGmaxTurn);
    return false;
  }
  if(mv.t==='Normal'){ await lungeFx('my-sprite'); }
  else { await attackFx('my-sprite','enemy-sprite', TYPES[mv.t].fx); }
  const mult = typeMult(mv.t, formOf(e).type);
  const big = mult>1 || powerMult(my)>1;
  burst('enemy-sprite','💥', big);
  if(big){ shakeScreen(); ringBurstFx('enemy-sprite', TYPES[mv.t].fx); }
  const dmg = Math.max(1, Math.round(
    (atkOf(my)*burnMult(my)*mv.pow*powerMult(my) + rand(4)) * mult * defFactor(e)));
  e.hp -= dmg;
  // Mega Mewtwo X can't be knocked out on the first try — you have to catch it!
  if(isCatchPhase() && e.hp < 1) e.hp = 1;
  sfx.hit(); shake('enemy-sprite');
  addGauge(18);
  renderBattle(mult>1 ? `SUPER hit! 💥 ${dmg} damage!` : mult<0.5 ? `It barely works on ${formOf(e).type} Pokémon... ${dmg} damage 🙈` : mult<1 ? `Hmm, not so good... ${dmg} damage` : `Pow! ${dmg} damage!`);
  setBtns(false);
  await sleep(900);
  if(e.hp>0) await landStatus(mv, e, 'enemy-sprite');
  await tickGmax(my, usedGmaxTurn);
  await maybeEnemyMega(); // dropping the last one below 55% sets off its Mega right away
  if(isCatchPhase() && e.hp===1){
    setMsg('Mega Mewtwo X is wobbly...! 🌟 Now! Throw the <b>Master Ball</b>!');
    busy=false; setBtns(true);
    return true;
  }
  if(e.hp<=0){
    e.hp=0;
    await enemyDown();
    return true;
  }
  return false;
}
async function tickGmax(my, used){
  if(!used || !my.gmax) return;
  my.gmax--;
  if(my.gmax<=0){
    delete my.gmax;
    setMsg('Dynamax wore off... back to normal size!');
    await sleep(900);
  }
}

async function enemyAction(emv){
  const e = B.enemy;
  await maybeEnemyMega();
  if(!await canAct(e)) return false;
  const my = activeMon();
  setMsg(`${monLabel(e)} used ${emv.name}!`);
  await sleep(500);
  if(Math.random() > emv.acc){
    sfx.fail();
    setMsg(`${monLabel(e)}'s attack missed! 😮`);
    await sleep(800);
    return false;
  }
  if(emv.t==='Normal'){ await lungeFx('enemy-sprite'); }
  else { await attackFx('enemy-sprite','my-sprite', TYPES[emv.t].fx); }
  const mult = typeMult(emv.t, formOf(my).type);
  burst('my-sprite','💥', mult>1);
  if(mult>1) shakeScreen();
  /* re-tuned so trainer battles land where they always did, now that enemies also
     get defence normalisation, status conditions and a Mega on their last Pokémon */
  const factor = B.trainer ? (B.legend ? 0.55 : 0.62) : 0.65;
  const dmg = Math.max(1, Math.round(
    (atkOf(e)*burnMult(e)*factor*emv.pow*powerMult(e) + rand(3)) * mult * defFactor(my)));
  my.hp = Math.max(0, my.hp - dmg);
  sfx.hit(); shake('my-sprite');
  addGauge(12);
  renderBattle(mult>1 ? `Ouch!! Super hit! ${dmg} damage!` : `Ouch! ${dmg} damage!`);
  setBtns(false);
  await sleep(900);
  if(my.hp>0){
    await landStatus(emv, my, 'my-sprite');
    return false;
  }
  return await myFainted(my);
}

/* burn & poison nibble away at the end of every turn */
async function endOfTurn(){
  for(const side of ['mine','enemy']){
    const m = side==='mine' ? activeMon() : B.enemy;
    if(!m || m.hp<=0) continue;
    if(m.st!=='brn' && m.st!=='psn') continue;
    const max = side==='mine' ? maxHpOf(m) : bossMaxHpOf(m);
    let d = Math.max(1, Math.round(max/16));
    if(side==='enemy' && isCatchPhase()) d = Math.min(d, m.hp-1);
    if(d<=0) continue;
    m.hp = Math.max(0, m.hp - d);
    sfx.hit();
    shake(side==='mine' ? 'my-sprite' : 'enemy-sprite');
    renderBattle(`${monLabel(m)} is hurt by ${m.st==='brn'?'its burn 🔥':'the poison ☠️'}! ${d} damage`);
    setBtns(false);
    await sleep(950);
    if(m.hp<=0){
      if(side==='mine') return await myFainted(m);
      await enemyDown();
      return true;
    }
  }
  return false;
}

async function enemyDown(){
  const e = B.enemy;
  if(B.trainer){ await trainerMonDown(); }
  else { await winWild(`The wild ${monLabel(e)} fell down!`); }
}

/* my Pokémon dropped: either pick who goes next, or head home */
async function myFainted(fallen){
  sfx.fail();
  clearStatus(fallen);
  delete fallen.tf;
  if(G.party.some(m=>m.hp>0)){
    setMsg(`${SPECIES[fallen.id].name} is too tired to battle...`);
    await sleep(1200);
    B.forced = true;
    busy=false;
    renderSwitch(true);
    return true;
  }
  setMsg('All your Pokémon are tired... Time to go home!');
  await sleep(1400);
  B.over=true; busy=false;
  clearBattleFlags();
  G.party.forEach(m=>m.hp=maxHpOf(m));
  save();
  renderTown('The nurse healed everyone! Let\'s try again! 💪');
  return true;
}

/* ============ SWITCHING ============ */
window.openSwitch = function(){
  if(busy||B.over) return;
  renderSwitch(false);
};
function renderSwitch(forced){
  sfx.tap();
  const cur = activeMon();
  const picks = G.party.map((m,i)=>({m,i})).filter(o => o.m.hp>0 && (forced || o.m !== cur));
  app.innerHTML = `
  <div class="card fadein">
    <h2>${forced ? '😵 Who goes next?' : '🔄 Switch Pokémon'}</h2>
    <p class="sub" style="text-align:left;">${forced
      ? 'Pick your next battler!'
      : 'Careful — switching uses up your turn, so the other one gets a free hit!'}</p>
    <div class="stack">
      ${picks.map(o=>{
        const s = SPECIES[o.m.id], mh = maxHpOf(o.m), pct = Math.round(o.m.hp/mh*100);
        return `
        <div class="party-item" onclick="pickSwitch(${o.i},${forced?1:0})" style="cursor:pointer;">
          ${spriteImg(o.m.id,52)}
          <div class="info">
            <div class="nm">${s.name} <span class="tag">${s.type}</span>${statusTag(o.m)}</div>
            <div class="lv">Lv.${o.m.lv} · HP ${o.m.hp}/${mh} · ⚡${s.spd} 🛡️${s.def}</div>
            <div class="hpbar"><div class="hpfill" style="width:${pct}%;background:${hpColor(pct)}"></div></div>
          </div>
          <span style="font-size:22px;">➡️</span>
        </div>`;
      }).join('')}
    </div>
    ${forced ? '' : `<div style="margin-top:12px;"><button class="big" onclick="cancelSwitch()">⬅ Never mind</button></div>`}
  </div>`;
}
window.cancelSwitch = function(){ sfx.tap(); renderBattle('What will you do? 🤔'); };
window.pickSwitch = async function(i, forced){
  if(busy) return;
  const target = G.party[i];
  if(!target || target.hp<=0) return;
  sfx.tap();
  const out = activeMon();
  const m = G.party.splice(i,1)[0];
  G.party.unshift(m); // the front of the team is always the one battling
  if(out !== m){ delete out.tf; } // a Ditto coming back drops its borrowed shape
  B.forced = false;
  const note = dittoPrep();
  if(forced){
    busy=false;
    renderBattle(`You can do it, <b>${monLabel(m)}</b>!` + note);
    return;
  }
  busy=true;
  renderBattle(`Come back! Go, <b>${monLabel(m)}</b>! 🔄` + note);
  setBtns(false);
  await sleep(1000);
  if(await enemyAction(pickEnemyMove(B.enemy))) return;
  if(await endOfTurn()) return;
  busy=false; setBtns(true);
};

window.throwBall = async function(){
  if(busy||B.over) return;
  const e = B.enemy;
  if(B.trainer && !isCatchPhase()){ setMsg("You can't catch a trainer's Pokémon! 😮"); return; }
  if(!isCatchPhase() && G.balls<=0){ setMsg('No balls left! Get more at the Pokémon Center.'); return; }
  if(!isCatchPhase() && G.party.length>=6 && boxOf().length>=BOX_MAX){
    setMsg('Your team AND your Box are full! Say bye-bye to someone first. 👋'); return;
  }
  busy=true; setBtns(false);
  const master = isCatchPhase();
  if(!master) G.balls--;
  setMsg(`You threw the ${master?'Master Ball':'Poké Ball'}! ${master?'🟣':'🔴'}`);
  await ballFx(master?'🟣':'🔴');
  await sleep(250);
  setMsg('Wiggle... wiggle... wiggle...');
  shake('enemy-sprite');
  await sleep(1100);
  const eMax = bossMaxHpOf(e);
  const hpRatio = e.hp/eMax;
  const sleepyBonus = e.st==='slp' ? 0.20 : 0; // a snoozing Pokémon is much easier to catch
  let chance;
  if(master){
    chance = hpRatio > 0.4 ? 0.05 : (1-hpRatio)*0.85;
    if(e.hp===1) chance = 0.95;
    chance += sleepyBonus;
  }else{
    chance = 0.25 + (1-hpRatio)*0.65 + sleepyBonus;
  }
  if(Math.random() < Math.min(1, chance)){
    sfx.catchOk();
    if(master){ await bossCaught(); return; }
    B.over=true;
    const caught = Object.assign({}, e, {hp:Math.max(e.hp, Math.round(maxHpOf(e)/2))});
    delete caught.bossMaxHp; delete caught.tf; delete caught.mega; delete caught.gmax;
    delete caught.st; delete caught.stT;
    let where = '';
    if(G.party.length<6){
      G.party.push(caught);
    }else{
      caught.hp = maxHpOf(caught); // the Box heals whoever rests in it
      boxOf().push(caught);
      where = ` Your team is full, so it went to the Box! 📦 (${boxOf().length}/${BOX_MAX})`;
    }
    if(!G.dex.includes(e.id)) G.dex.push(e.id);
    setMsg(`Click! ✨ You caught <b>${SPECIES[e.id].name}</b>!` + where);
    await sleep(1600);
    await winWild(null, true);
  }else{
    sfx.fail();
    setMsg(master ? 'Oh no, it popped out! Make it more sleepy first!' : 'Oh no, it popped out! Hit it a little, then try again!');
    await sleep(1100);
    if(await enemyAction(pickEnemyMove(B.enemy))) return;
    if(await endOfTurn()) return;
    busy=false; setBtns(true);
  }
};

window.runAway = async function(){
  if(busy||B.over) return; busy=true; setBtns(false);
  sfx.tap();
  setMsg(B.trainer ? 'You ran away! The trainer will wait for you. 💨' : 'You ran away! 💨');
  await sleep(900);
  B.over=true; busy=false;
  clearBattleFlags();
  save();
  renderTown();
};

/* ===== exp / level ups (shared) ===== */
async function grantExp(defeated, isTrainerMon){
  const my = activeMon();
  const gained = defeated.lv*(isTrainerMon?8:5) + 5;
  my.exp += gained;
  setMsg(`${SPECIES[my.id].name} got ⭐${gained} stars!`);
  await sleep(1100);
  while(my.exp >= expNeed(my)){
    my.exp -= expNeed(my);
    my.lv++;
    my.hp = Math.min(maxHpOf(my), my.hp + 8);
    sfx.good();
    setMsg(`🎉 Level up! ${SPECIES[my.id].name} is Level ${my.lv} now!`);
    await sleep(1100);
  }
}
/* the Box keeps everyone rested, so top them up whenever we save the game state */
function restBox(){ boxOf().forEach(m => { m.hp = maxHpOf(m); clearStatus(m); }); }
function findEvolution(){
  const m = G.party.find(m => SPECIES[m.id].evolveLv && m.lv >= SPECIES[m.id].evolveLv);
  if(!m) return null;
  let to = SPECIES[m.id].evolveTo;
  if(Array.isArray(to)) to = to[rand(to.length)]; // Eevee picks a surprise form!
  return {mon:m, from:m.id, to};
}
/* evolution chain → then town */
function finishBattle(msg){
  clearBattleFlags();
  restBox();
  save();
  const evo = findEvolution();
  if(evo){ renderEvolution(evo, msg); return; }
  renderTown(msg);
}

/* ===== wild battle victory ===== */
async function winWild(msg, wasCatch){
  B.over=true;
  const e = B.enemy;
  if(msg){ sfx.good(); setMsg(msg); await sleep(1000); }
  await grantExp(e, false);
  if(!wasCatch && Math.random()<0.4){
    G.balls++;
    setMsg('You found a Poké Ball on the ground! 🔴 +1');
    await sleep(900);
  }
  busy=false;
  finishBattle(wasCatch ? `You made a new friend! Your Pokédex has ${G.dex.length}/${TOTAL_KINDS} kinds now! 📖` : 'You did it! 🎉');
}

/* ===== trainer battle: next mon or victory ===== */
async function trainerMonDown(){
  const e = B.enemy;
  sfx.good();
  setMsg(`${monLabel(e)} fell down!`);
  await sleep(900);
  await grantExp(e, true);
  if(B.queue.length){
    B.enemy = B.queue.shift();
    sfx.fail();
    const note = dittoPrep(); // a fresh opponent means a fresh copy for Ditto
    renderBattle(`${B.trainer.avatar} ${B.trainer.trainer} sends out <b>${SPECIES[B.enemy.id].name}</b>!` + note);
    busy=false; setBtns(true);
    return;
  }
  // whole team beaten!
  B.over=true; busy=false;
  if(B.plaza){
    G.balls++;
    sfx.fanfare();
    finishBattle(`You beat ${B.trainer.trainer}! 🎉 They gave you a Poké Ball! 🔴 +1`);
    return;
  }
  if(B.cave && !G.badges.includes(B.cave.badge)){
    G.badges.push(B.cave.badge);
    sfx.fanfare();
    setMsg(`🏅 You beat ${B.trainer.trainer}! You got the ${B.cave.name} badge! ${G.badges.length}/5`);
    await sleep(1500);
    if(G.badges.length===3){
      sfx.power();
      setMsg('✨ You found a <b>Mega Bracelet</b>! 💠 Now some Pokémon can MEGA EVOLVE in battle!');
      await sleep(1800);
    }
    if(G.badges.length===5){
      sfx.power();
      setMsg('✨ You found a <b>Dynamax Band</b>! 🔴 Now your best Pokémon can go GIANT in battle!');
      await sleep(1800);
    }
    finishBattle(`${B.trainer.trainer}: "Wow, you're strong! Come back anytime for a rematch!"`);
    return;
  }
  sfx.fanfare();
  finishBattle(B.legend
    ? `You beat the Champion again! What a team! 🏆`
    : `You beat ${B.trainer.trainer} again! Great practice! 💪`);
}

/* ============ EVOLUTION ============ */
function renderEvolution(evo, nextMsg){
  const fromS = SPECIES[evo.from], toS = SPECIES[evo.to];
  app.innerHTML = `
  <div class="card fadein center">
    <h2>Huh...? ${fromS.name} looks funny...!</h2>
    <div class="evo-stage flashit" id="evo-sprite">${spriteImg(evo.from,130)}</div>
    <div class="msgbox center" id="evo-msg" style="justify-content:center;"><span>✨ It's glowing! ✨</span></div>
    <div style="margin-top:14px;"><button class="big yellow" id="evo-btn" disabled>...</button></div>
  </div>`;
  setTimeout(()=>{
    const sp = document.getElementById('evo-sprite');
    const mg = document.getElementById('evo-msg');
    const bt = document.getElementById('evo-btn');
    if(!sp) return;
    // apply evolution — fully healed, feels great
    evo.mon.id = evo.to;
    evo.mon.hp = maxHpOf(evo.mon);
    if(!G.dex.includes(evo.to)) G.dex.push(evo.to);
    save();
    sfx.fanfare();
    ringBurstFx('evo-sprite','✨');
    sp.innerHTML = spriteImg(evo.to,130);
    sp.classList.remove('flashit');
    sp.classList.add('bounce');
    mg.innerHTML = `<span>🎊 WOW! <b>${fromS.name}</b> became <b>${toS.name}</b>!</span>`;
    bt.disabled = false;
    bt.textContent = 'Yay! 🎉';
    bt.onclick = ()=>{ sfx.tap(); finishBattle(nextMsg || `${toS.name} is super strong now!`); };
  }, 1700);
}

/* ============ BOSS CAUGHT ============ */
async function bossCaught(){
  B.over=true; busy=false;
  BGM.stop();
  clearBattleFlags();
  G.bossCaught = true;
  if(!G.dex.includes('mewtwoX')) G.dex.push('mewtwoX');
  const mw = newMon('mewtwoX', 24); mw.hp = maxHpOf(mw);
  let toBox = false;
  if(G.party.length<6){ G.party.push(mw); }
  else if(boxOf().length<BOX_MAX){ boxOf().push(mw); toBox = true; }
  restBox();
  save();
  sfx.fanfare();
  confetti();
  app.innerHTML = `
  <div class="card fadein center">
    <div class="mon-big"><span class="bounce">${spriteImg('mewtwoX',130)}</span></div>
    <h1>🏆 YOU WIN! 🏆</h1>
    <p class="sub" style="font-size:16px;">You beat the Champion and caught <b>Mega Mewtwo X</b>!<br>
    ${G.party.some(m=>m.id==='mewtwoX') ? 'Now it\'s your friend! 💜' : toBox ? 'It is waiting for you in the Box! 📦' : 'It\'s in your book now! 📖'}</p>
    <div class="card" style="background:var(--soft); margin:10px 0;">
      <b>Your Adventure</b><br>
      🏅 Badges: ${G.badges.length}/5 &nbsp;·&nbsp; 📖 Pokédex: ${G.dex.length}/${TOTAL_KINDS}<br>
      🎒 Friends: ${G.party.length} &nbsp;·&nbsp; 📦 Box: ${boxOf().length} &nbsp;·&nbsp; ⭐ Best Level: ${Math.max(...G.party.map(m=>m.lv))}<br>
      <small>Can you fill the whole Pokédex? Trainers love rematches!</small>
    </div>
    <div class="stack">
      <button class="big green" onclick="backTown()">🌿 Keep Exploring</button>
      <button class="big" onclick="toTitle()">💾 Save Slots</button>
    </div>
  </div>`;
}
function confetti(){
  const emo = ['🎉','⭐','💜','✨','🎊','🔴'];
  for(let i=0;i<28;i++){
    const s = document.createElement('span');
    s.className='confetti';
    s.textContent = emo[rand(emo.length)];
    s.style.left = rand(100)+'vw';
    s.style.animationDuration = (2+Math.random()*2)+'s';
    s.style.animationDelay = (Math.random()*1.5)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 6000);
  }
}

renderTitle();
</script>
