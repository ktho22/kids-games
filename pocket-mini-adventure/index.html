<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Mini Adventure</title>
<style>
  :root{
    --sky:#aee7f8; --grass:#b9e98c; --panel:#fffdf3; --ink:#2b3a55;
    --red:#e8484f; --yellow:#ffc93c; --green:#58b368; --blue:#4a9fe0;
    --soft:#ffe9b0; --shadow:0 6px 0 rgba(43,58,85,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Comic Sans MS','Chalkboard SE','Comic Neue',sans-serif;
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky) 45%,var(--grass) 100%);
    min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
    color:var(--ink); padding:16px 10px 40px;
  }
  #app{width:100%; max-width:430px;}
  .card{
    background:var(--panel); border:4px solid var(--ink); border-radius:22px;
    padding:18px; box-shadow:var(--shadow); margin-bottom:14px;
  }
  h1{font-size:29px; margin:4px 0 2px; text-align:center; letter-spacing:-.5px;}
  h2{font-size:21px; margin:0 0 10px;}
  .sub{text-align:center; color:#6b7a99; font-weight:700; margin:0 0 14px; font-size:14px;}
  button{
    font-family:inherit; font-size:17px; font-weight:800; color:var(--ink);
    background:#fff; border:3px solid var(--ink); border-radius:16px;
    padding:13px 14px; cursor:pointer; box-shadow:0 4px 0 rgba(43,58,85,.2);
    transition:transform .05s;
  }
  button:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(43,58,85,.2);}
  button:disabled{opacity:.45; cursor:default;}
  button.big{width:100%; font-size:19px; padding:16px;}
  button.red{background:var(--red); color:#fff;}
  button.yellow{background:var(--yellow);}
  button.green{background:var(--green); color:#fff;}
  button.blue{background:var(--blue); color:#fff;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .row{display:flex; gap:10px; align-items:center;}
  .spacer{flex:1;}
  .mon-big{font-size:72px; text-align:center; line-height:1.1; filter:drop-shadow(0 4px 0 rgba(43,58,85,.15));}
  .mon-mid{font-size:44px; line-height:1;}
  .sprite{image-rendering:pixelated; vertical-align:middle; display:inline-block;}
  .bounce{display:inline-block; animation:bounce 1.6s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .shakeit{animation:shake .45s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .flashit{animation:flash .5s 3;}
  @keyframes flash{0%,100%{filter:brightness(1)}50%{filter:brightness(3) saturate(0)}}
  .hpbar{height:14px; background:#e3e0d2; border:2px solid var(--ink); border-radius:99px; overflow:hidden;}
  .hpfill{height:100%; border-radius:99px; transition:width .4s;}
  .tag{display:inline-block; font-size:12px; font-weight:800; padding:2px 9px; border-radius:99px; border:2px solid var(--ink); background:var(--soft);}
  .trainer-line{font-size:13px; font-weight:800; color:#6b7a99;}
  .msgbox{
    background:#fff; border:3px solid var(--ink); border-radius:14px;
    padding:12px 14px; font-weight:800; font-size:16px; min-height:52px;
    display:flex; align-items:center;
  }
  .party-item{
    display:flex; align-items:center; gap:10px; background:#fff;
    border:3px solid var(--ink); border-radius:16px; padding:10px 12px;
  }
  .party-item.active-mon{background:var(--soft);}
  .party-item .info{flex:1;}
  .party-item .nm{font-weight:800; font-size:16px;}
  .party-item .lv{font-size:13px; color:#6b7a99; font-weight:800;}
  .ball-count{font-weight:800; font-size:15px;}
  .progress-note{font-size:13px; font-weight:800; color:#6b7a99; margin-top:4px;}
  .center{text-align:center;}
  .evo-stage{font-size:80px; text-align:center; margin:20px 0;}
  .fx-particle{position:fixed; font-size:26px; z-index:50; pointer-events:none; line-height:1;}
  .confetti{position:fixed; top:-20px; font-size:22px; animation:fall linear forwards; z-index:5; pointer-events:none;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}
  .starter-btn{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 6px;}
  .fadein{animation:fadein .35s;}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){
    .bounce,.shakeit,.flashit,.confetti,.fadein{animation:none !important;}
  }
  /* tablets (iPad): scale the whole game up so it fills the screen */
  @media (min-width: 700px){
    #app{ zoom: 1.5; }
    .fx-particle{ font-size: 38px; }
    .confetti{ font-size: 32px; }
  }
  @media (min-width: 1000px){
    #app{ zoom: 1.8; }
  }
</style>

</head>

function newMon(speciesId, lv){
  const s = SPECIES[speciesId];
  const maxHp = s.hp + lv*2;
  return {id:speciesId, lv, exp:0, hp:maxHp};
}
function maxHpOf(m){ return SPECIES[m.id].hp + m.lv*2; }
function atkOf(m){ return SPECIES[m.id].atk + Math.floor(m.lv/2); }
function expNeed(m){ return m.lv*12; }
function activeMon(){ return G.party.find(m=>m.hp>0) || G.party[0]; }

function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }catch(e){}
}
function load(){
  try{
    const d = localStorage.getItem(SAVE_KEY);
    if(d){
      const g = JSON.parse(d);
      if(g && g.party && g.party.length){
        if(!g.badges) g.badges=[];
        g.badges = g.badges.map(b => OLD_BADGE_MAP[b] || b); // migrate old saves
        return g;
      }
    }
  }catch(e){}
  return null;
}

/* ============ SOUND ============ */
let AC = null;
function beep(freq, dur, type='square', vol=.15){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
const sfx = {
  tap:   ()=>beep(600,.06,'square',.08),

  fail:  ()=>beep(220,.25,'triangle',.15),
  heal:  ()=>{[392,523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.18,'sine',.12), i*140));},
  fanfare:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.22,'square',.12), i*160));},
};

  town:   {beat:200,
    lead:[72,0,76,0, 79,0,76,0, 81,79,76,72, 74,76,72,0],

    bass:[40,40,47,40, 40,40,47,40, 38,38,45,38, 40,40,47,40]},
};
const BGM = {
  enabled: true, name: null, timer: null, step: 0,
  load(){ try{ this.enabled = localStorage.getItem('bgm-off') !== '1'; }catch(e){} },
  freq(n){ return 440*Math.pow(2,(n-69)/12); },
  play(name){
    if(this.name === name && this.timer) return;
    this.stop();
    this.name = name;
    if(!this.enabled) return;
    const t = BGM_THEMES[name];
    if(!t) return;
    this.step = 0;
    this.timer = setInterval(()=>{
      const lead = t.lead[this.step % t.lead.length];
      const bass = t.bass[this.step % t.bass.length];
      if(lead) beep(this.freq(lead), t.beat/1000*0.9, 'square', .045);
      if(bass) beep(this.freq(bass), t.beat/1000*0.9, 'triangle', .06);
      this.step++;
    }, t.beat);
  },
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer = null; } this.name = null; },
  toggle(){
    this.enabled = !this.enabled;
    try{ localStorage.setItem('bgm-off', this.enabled ? '0' : '1'); }catch(e){}
    if(!this.enabled) this.stop();
    return this.enabled;
  },
};
BGM.load();
window.toggleBgm = function(){ BGM.toggle(); renderTown(); };

function spriteImg(id, size){
  const src = SPRITES[id];
  if(!src) return `<span style="font-size:${size*0.8}px">${SPECIES[id].emoji}</span>`;
  return `<img class="sprite" src="${src}" alt="${SPECIES[id].name}" style="width:${size}px;height:${size}px;">`;
}

function renderTitle(){
  const hasSave = !!load();
  app.innerHTML = `
  <div class="card fadein center">
    <div class="mon-big"><span class="bounce">${spriteImg('pikachu',84)}</span> <span class="bounce" style="animation-delay:.3s">${spriteImg('pairi',84)}</span> <span class="bounce" style="animation-delay:.6s">${spriteImg('kkobugi',84)}</span></div>

/* ============ SCREEN: TOWN ============ */
function bossUnlocked(){
  return G.badges.length >= CAVES.length;
}
function caveOpen(i){
  return i===0 ? G.dex.length >= 2 : G.badges.includes(CAVES[i-1].badge);
}
function renderTown(msg){
  BGM.play('town');
  const unlocked = bossUnlocked();
  const a = activeMon();
  app.innerHTML = `
  <div class="card fadein">
    <div class="row">
      <h2>🏘️ Pokémon Town</h2>
      <div class="spacer"></div>
      <span class="ball-count">🏅 ${G.badges.length}/5 · 🔴 ×${G.balls}</span>
      <button style="padding:5px 9px; font-size:14px;" onclick="toggleBgm()">${BGM.enabled?'🔊':'🔇'}</button>
    </div>
    ${msg?`<div class="msgbox" style="margin-bottom:12px;"><span>${msg}</span></div>`:''}
    <div class="party-item active-mon" style="margin-bottom:12px;">
      ${spriteImg(a.id,56)}
      <div class="info">
        <div class="nm">${SPECIES[a.id].name} <span class="tag">${SPECIES[a.id].type}</span></div>
        <div class="lv">Lv.${a.lv} · HP ${a.hp}/${maxHpOf(a)}</div>
      </div>
      <span style="font-size:13px;font-weight:800;color:#6b7a99;">My buddy</span>
    </div>
    <div class="stack">
      <div class="grid2">
        ${AREAS.map((ar,i)=>{
          const open = G.badges.length >= ar.need;
          return `<button class="${open?'green':''}" ${open?'':'disabled'} onclick="goArea(${i})">
            ${open?ar.icon:'🔒'} ${ar.name}<br><small>${open?`Lv.${ar.min}–${ar.max}`:`Need ${ar.need} badge${ar.need>1?'s':''}`}</small>
          </button>`;
        }).join('')}
      </div>
      <div class="grid2">
        <button class="blue" onclick="healAll()">🏥 Pokémon Center<br><small>Heal everyone</small></button>
        <button class="yellow" onclick="renderParty()">🎒 My Pokémon<br><small>${G.party.length} friends · ${G.dex.length}/${TOTAL_KINDS} kinds</small></button>
      </div>
      <div class="grid2" style="grid-template-columns:repeat(5,1fr); gap:8px;">
        ${CAVES.map((c,i)=>{
          const done = G.badges.includes(c.badge);
          const open = caveOpen(i);
          return `<button class="${open?'yellow':''}" ${open?'':'disabled'} onclick="goCave(${i})" style="padding:10px 2px; font-size:12px; line-height:1.3;">
            <span style="font-size:22px;">${done?'🏅':open?c.icon:'🔒'}</span><br>${c.name.split(' ')[0]}
          </button>`;
        }).join('')}
      </div>
      ${G.dex.length<2 && G.badges.length===0 ? `<div class="progress-note center">Catch 1 Pokémon in the grass to open the first cave!</div>`
        : !unlocked ? `<div class="progress-note center">Beat cave trainers to get badges! 🏅 ${G.badges.length}/5 · Cleared caves can be replayed!</div>` : ''}
      <button class="big ${unlocked?'red':''}" ${unlocked?'':'disabled'} onclick="goBoss()">
        ${G.bossCaught ? '🏆 Legend Cave — Champion Rematch!' : unlocked ? '🌋 Legend Cave — The Champion!' : '🔒 Legend Cave'}
      </button>
    </div>
  </div>`;
}

/* ============ POKEMON CENTER ============ */
window.healAll = function(){
  if(busy) return; busy = true;
  sfx.tap();
  app.innerHTML = `
  <div class="card fadein center">
    <h2>🏥 Pokémon Center</h2>
    <div style="font-size:64px;" class="bounce">👩‍⚕️</div>
    <div class="msgbox center" style="justify-content:center;"><span>"One moment please!" 💗</span></div>
    <div style="font-size:40px; margin:16px 0;" id="heal-monsters">${G.party.map(m=>spriteImg(m.id,48)).join(' ')}</div>
  </div>`;
  sfx.heal();
  heartsFx('heal-monsters');
  setTimeout(()=>{
    G.party.forEach(m=>m.hp=maxHpOf(m));
    G.balls = Math.max(G.balls,5);
    save();
    sfx.catchOk();
    busy = false;
    renderTown('All better! "Come back anytime!" 💗 Poké Balls are full too!');
  }, 2000);
};
function heartsFx(targetId){
  const c = centerOf(targetId);
  if(!c || noMotion) return;
  const emo = ['💗','✨','💖','🌟'];
  for(let i=0;i<12;i++){
    const s = spawnFx(c.x + (Math.random()*180-90), c.y + 10, emo[rand(emo.length)]);
    if(s.animate) s.animate(
      [{transform:'translateY(0) scale(.5)', opacity:0},
       {opacity:1, offset:.25},
       {transform:'translateY(-100px) scale(1.25)', opacity:0}],
      {duration:1300, delay:i*130, easing:'ease-out', fill:'forwards'});
    setTimeout(()=>s.remove(), 1500+i*130);
  }
}

/* ============ SCREEN: MY POKEMON ============ */
window.renderParty = function(msg){
  sfx.tap();
  app.innerHTML = `
  <div class="card fadein">
    <h2>🎒 My Pokémon <small style="color:#6b7a99">(${G.party.length}/6)</small></h2>
    <p class="sub" style="text-align:left;">The top one battles first. Tap to change! Tap 👋 to say bye-bye.</p>
    ${msg?`<div class="msgbox" style="margin-bottom:12px;"><span>${msg}</span></div>`:''}
    <div class="stack">
      ${G.party.map((m,i)=>{
        const s = SPECIES[m.id], mh = maxHpOf(m), pct = Math.round(m.hp/mh*100);
        return `
        <div class="party-item ${i===0?'active-mon':''}" onclick="setLeader(${i})" style="cursor:pointer;">
          ${spriteImg(m.id,56)}
          <div class="info">
            <div class="nm">${s.name} <span class="tag">${s.type}</span> ${m.hp===0?'😵':''}</div>
            <div class="lv">Lv.${m.lv} · ⭐ ${m.exp}/${expNeed(m)}</div>
            <div class="hpbar"><div class="hpfill" style="width:${pct}%;background:${hpColor(pct)}"></div></div>
          </div>
          <button style="padding:6px 10px; font-size:14px;" onclick="releaseMon(event,${i})">👋</button>
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:14px;"><button class="big" onclick="backTown()">⬅ Back to Town</button></div>
  </div>`;
};
window.setLeader = function(i){
  if(i===0) return;
  sfx.tap();
  const m = G.party.splice(i,1)[0];
  G.party.unshift(m);
  save();
  renderParty();
};
window.releaseMon = function(ev, i){
  ev.stopPropagation();
  if(G.party.length<=1){ renderParty('You need at least 1 Pokémon! 😊'); return; }
  const m = G.party[i];
  if(!confirm(`Say bye-bye to ${SPECIES[m.id].name}? It will go play in the wild.`)) return;
  G.party.splice(i,1);
  G.balls++;
  sfx.good();
  save();
  renderParty(`${SPECIES[m.id].name} waved bye-bye! 👋 It left a Poké Ball for you! 🔴 +1`);
};
window.backTown = function(){ sfx.tap(); renderTown(); };
function hpColor(pct){ return pct>50?'var(--green)':pct>25?'var(--yellow)':'var(--red)'; }

/* ============ BATTLE ============ */
window.goArea = function(i){
  sfx.tap();
  const ar = AREAS[i];
  if(G.badges.length < ar.need) return;
  if(activeMon().hp===0){ renderTown('Your Pokémon are all tired! Heal them first. 🏥'); return; }
  const wildId = ar.pool[rand(ar.pool.length)];
  const lv = ar.min + rand(ar.max - ar.min + 1);
  B = {enemy:newMon(wildId, lv), trainer:null, cave:null, legend:false, queue:[], over:false};
  BGM.play('battle');
  renderBattle(`Look! A wild <b>${SPECIES[B.enemy.id].name}</b> is here!`);
  sfx.tap();
};
function makeTrainerMon(id, lv){
  const m = newMon(id, lv);
  m.bossMaxHp = Math.round(maxHpOf(m)*1.2); // trainer Pokémon are extra tough
  m.hp = m.bossMaxHp;
  return m;
}
window.goCave = function(i){
  sfx.tap();
  const c = CAVES[i];
  if(activeMon().hp===0){ renderTown('Your Pokémon are all tired! Heal them first. 🏥'); return; }
  const queue = c.team.map(([id,lv]) => makeTrainerMon(id, lv));
  B = {enemy:queue.shift(), trainer:c, cave:c, legend:false, queue, over:false};
  BGM.play('boss');
  renderBattle(`${c.avatar} ${c.trainer} wants to battle! "Go, <b>${SPECIES[B.enemy.id].name}</b>!"`);
  sfx.fail();
};
window.goBoss = function(){
  sfx.tap();
  if(activeMon().hp===0){ renderTown('Your Pokémon are all tired! Heal them first. 🏥'); return; }
  if(!G.masterBall){
    G.masterBall = true; save();
    renderTown('You found a shiny <b>Master Ball</b>! 🟣 It can catch ANY Pokémon! Tap the cave again to go in!');
    return;
  }
  const queue = LEGEND.team.map(([id,lv]) => makeTrainerMon(id, lv));
  const mw = newMon('mewtwoX', 24);
  mw.bossMaxHp = 200; mw.hp = 200;
  queue.push(mw);
  B = {enemy:queue.shift(), trainer:LEGEND, cave:null, legend:true, queue, over:false};
  BGM.play('boss');
  renderBattle(`${LEGEND.avatar} ${LEGEND.trainer} wants to battle! "Go, <b>${SPECIES[B.enemy.id].name}</b>!"`);
  sfx.fail();
};
function bossMaxHpOf(m){ return m.bossMaxHp || maxHpOf(m); }
function isCatchPhase(){ return B.legend && B.enemy.id==='mewtwoX' && !G.bossCaught; }

function movesOf(m){
  const s = SPECIES[m.id];
  const special = TYPES[s.type].move;
  return [
    {name:'Tackle', pow:1.0, acc:1.0},
    {name:special, pow:1.6, acc:0.75},
  ];
}
function typeMult(atkType, defType){
  if(TYPES[atkType].beats === defType) return 1.5;
  if(TYPES[defType].beats === atkType) return 0.7;
  return 1;
}

function renderBattle(msg){
  const e = B.enemy, my = activeMon();
  const es = SPECIES[e.id], ms = SPECIES[my.id];
  const eMax = bossMaxHpOf(e);
  const ePct = Math.max(0, Math.round(e.hp/eMax*100));
  const mMax = maxHpOf(my), mPct = Math.max(0, Math.round(my.hp/mMax*100));
  const mv = movesOf(my);
  const teamDots = B.trainer ? '🔴'.repeat(1 + B.queue.length) : '';
  const ballBtn = isCatchPhase()
    ? `<button class="yellow" id="btn-ball" onclick="throwBall()">🟣 Master Ball</button>`
    : `<button class="yellow" id="btn-ball" onclick="throwBall()">🔴 Ball ×${G.balls}</button>`;
  app.innerHTML = `
  <div class="card fadein">
    ${B.trainer ? `<div class="trainer-line" style="margin-bottom:6px;">${B.trainer.avatar} ${B.trainer.trainer} &nbsp;${teamDots}</div>` : ''}
    <div class="row" style="align-items:flex-start;">
      <div style="flex:1;">
        <div class="nm" style="font-weight:800;">${es.name} <span class="tag">${es.type}</span></div>
        <div class="lv" style="font-size:13px;color:#6b7a99;font-weight:800;">Lv.${e.lv}</div>
        <div class="hpbar" style="margin-top:4px;"><div class="hpfill" style="width:${ePct}%;background:${hpColor(ePct)}"></div></div>
      </div>
      <div class="mon-big" id="enemy-sprite">${spriteImg(e.id, B.trainer?110:100)}</div>
    </div>
    <div class="row" style="align-items:flex-end; margin-top:10px;">
      <div class="mon-big" id="my-sprite">${spriteImg(my.id,88)}</div>
      <div style="flex:1;">
        <div class="nm" style="font-weight:800; text-align:right;">${ms.name} <span class="tag">${ms.type}</span></div>
        <div class="lv" style="font-size:13px;color:#6b7a99;font-weight:800;text-align:right;">Lv.${my.lv} · HP ${my.hp}/${mMax}</div>
        <div class="hpbar" style="margin-top:4px;"><div class="hpfill" style="width:${mPct}%;background:${hpColor(mPct)}"></div></div>
      </div>
    </div>
    <div class="msgbox" id="battle-msg" style="margin:12px 0;"><span>${msg}</span></div>
    <div class="grid2" id="battle-btns">
      <button class="red" onclick="useMove(0)">👊 ${mv[0].name}</button>
      <button class="red" onclick="useMove(1)">✨ ${mv[1].name}</button>
      ${ballBtn}
      <button onclick="runAway()">💨 Run Away</button>
    </div>
  </div>`;
}
function setMsg(t){ const el=document.getElementById('battle-msg'); if(el) el.innerHTML='<span>'+t+'</span>'; }
function setBtns(on){
  document.querySelectorAll('#battle-btns button').forEach(b=>b.disabled=!on);
}
function shake(id){
  const el=document.getElementById(id);
  if(el){ el.classList.remove('shakeit'); void el.offsetWidth; el.classList.add('shakeit'); }
}

/* ===== attack effects ===== */
const noMotion = typeof matchMedia==='function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
function centerOf(id){
  const el = document.getElementById(id);
  if(!el || typeof el.getBoundingClientRect!=='function') return null;
  const r = el.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2};
}
function spawnFx(x, y, emoji, size){
  const s = document.createElement('span');
  s.className = 'fx-particle';
  s.textContent = emoji;
  if(size) s.style.fontSize = size+'px';
  s.style.left = (x-14)+'px'; s.style.top = (y-14)+'px';
  document.body.appendChild(s);
  return s;
}
/* particles fly from attacker to target (e.g. Water Gun = water drops) */
async function attackFx(fromId, toId, emoji){
  const a = centerOf(fromId), b = centerOf(toId);
  if(!a || !b || noMotion) return;
  const n = 6;
  for(let i=0;i<n;i++){
    const s = spawnFx(a.x, a.y, emoji);
    const dx = b.x-a.x + (Math.random()*36-18);
    const dy = b.y-a.y + (Math.random()*36-18);
    if(s.animate) s.animate(
      [{transform:'translate(0,0) scale(.6)', opacity:1},
       {transform:`translate(${dx}px,${dy}px) scale(1.25)`, opacity:.95}],
      {duration:320, delay:i*65, easing:'ease-in', fill:'forwards'});
    setTimeout(()=>s.remove(), 420+i*65);
  }
  await sleep(320 + n*65);
}
/* impact pop on the target */
function burst(atId, emoji){
  const c = centerOf(atId);
  if(!c || noMotion) return;
  const s = spawnFx(c.x, c.y, emoji, 44);
  if(s.animate) s.animate(
    [{transform:'scale(.4)', opacity:1},{transform:'scale(1.7)', opacity:0}],
    {duration:420, easing:'ease-out', fill:'forwards'});
  setTimeout(()=>s.remove(), 480);
}
/* body-slam lunge toward the other side */
async function lungeFx(fromId){
  const el = document.getElementById(fromId);
  if(!el || !el.animate || noMotion) return;
  const d = fromId==='my-sprite' ? {x:44,y:-30} : {x:-44,y:30};
  el.animate(
    [{transform:'translate(0,0)'},{transform:`translate(${d.x}px,${d.y}px)`,offset:.45},{transform:'translate(0,0)'}],
    {duration:300, easing:'ease-in-out'});
  await sleep(300);
}
/* ball arc from my side to the enemy */
async function ballFx(emoji){
  const a = centerOf('my-sprite'), b = centerOf('enemy-sprite');
  if(!a || !b || noMotion) return;
  const s = spawnFx(a.x, a.y, emoji, 30);
  if(s.animate) s.animate(
    [{transform:'translate(0,0) rotate(0deg)'},
     {transform:`translate(${(b.x-a.x)/2}px,${b.y-a.y-70}px) rotate(360deg)`, offset:.5},
     {transform:`translate(${b.x-a.x}px,${b.y-a.y}px) rotate(720deg)`}],
    {duration:550, easing:'ease-in', fill:'forwards'});
  setTimeout(()=>s.remove(), 600);
  await sleep(550);
}

window.useMove = async function(i){
  if(busy||B.over) return; busy=true; setBtns(false);
  const my = activeMon(), e = B.enemy;
  const mv = movesOf(my)[i];
  setMsg(`${SPECIES[my.id].name} used ${mv.name}!`);
  await sleep(400);
  if(Math.random() > mv.acc){
    sfx.fail(); setMsg('Oops, it missed! 😅');
    await sleep(800);
    await enemyTurn();
    return;
  }
  if(i===0){ await lungeFx('my-sprite'); }
  else { await attackFx('my-sprite','enemy-sprite', TYPES[SPECIES[my.id].type].fx); }
  burst('enemy-sprite','💥');
  const mult = typeMult(SPECIES[my.id].type, SPECIES[e.id].type);
  let dmg = Math.max(2, Math.round((atkOf(my)*mv.pow + rand(4)) * mult));
  e.hp -= dmg;
  // Mega Mewtwo X can't be knocked out on the first try — you have to catch it!
  if(isCatchPhase() && e.hp < 1) e.hp = 1;
  sfx.hit(); shake('enemy-sprite');
  renderBattle(mult>1 ? `SUPER hit! 💥 ${dmg} damage!` : mult<1 ? `Hmm, not so good... ${dmg} damage` : `Pow! ${dmg} damage!`);
  setBtns(false);
  await sleep(900);
  if(isCatchPhase() && e.hp===1){
    setMsg('Mega Mewtwo X is wobbly...! 🌟 Now! Throw the <b>Master Ball</b>!');
    busy=false; setBtns(true);
    return;
  }
  if(e.hp<=0){
    e.hp=0;
    if(B.trainer){ await trainerMonDown(); }
    else { await winWild(`The wild ${SPECIES[e.id].name} fell down!`); }
    return;
  }
  await enemyTurn();
};

async function enemyTurn(){
  const my = activeMon(), e = B.enemy;
  setMsg(`${SPECIES[e.id].name} attacks!`);
  await sleep(500);
  await attackFx('enemy-sprite','my-sprite', TYPES[SPECIES[e.id].type].fx);
  burst('my-sprite','💥');
  const mult = typeMult(SPECIES[e.id].type, SPECIES[my.id].type);
  const factor = B.trainer ? (B.legend ? 0.95 : 1.0) : 0.7;
  let dmg = Math.max(1, Math.round((atkOf(e)*factor + rand(3)) * mult));
  my.hp = Math.max(0, my.hp - dmg);
  sfx.hit(); shake('my-sprite');
  renderBattle(`Ouch! ${dmg} damage!`);
  setBtns(false);
  await sleep(900);
  if(my.hp===0){
    const next = G.party.find(m=>m.hp>0);
    if(next){
      sfx.fail();
      setMsg(`${SPECIES[my.id].name} is too tired... Go, ${SPECIES[next.id].name}!`);
      await sleep(1100);
      renderBattle(`You can do it, ${SPECIES[next.id].name}!`);
      busy=false; setBtns(true);
      return;
    }
    // all fainted
    sfx.fail();
    setMsg('All your Pokémon are tired... Time to go home!');
    await sleep(1400);
    B.over=true; busy=false;
    G.party.forEach(m=>m.hp=maxHpOf(m));
    save();
    renderTown('The nurse healed everyone! Let\'s try again! 💪');
    return;
  }
  busy=false; setBtns(true);
}

window.throwBall = async function(){
  if(busy||B.over) return;
  const e = B.enemy;
  if(B.trainer && !isCatchPhase()){ setMsg("You can't catch a trainer's Pokémon! 😮"); return; }
  if(!isCatchPhase() && G.balls<=0){ setMsg('No balls left! Get more at the Pokémon Center.'); return; }
  if(G.party.length>=6 && !isCatchPhase()){ setMsg('Your team is full! Say bye-bye to someone first. 👋'); return; }
  busy=true; setBtns(false);
  const master = isCatchPhase();
  if(!master) G.balls--;
  setMsg(`You threw the ${master?'Master Ball':'Poké Ball'}! ${master?'🟣':'🔴'}`);
  await ballFx(master?'🟣':'🔴');
  await sleep(250);
  setMsg('Wiggle... wiggle... wiggle...');
  shake('enemy-sprite');
  await sleep(1100);
  const eMax = bossMaxHpOf(e);
  const hpRatio = e.hp/eMax;
  let chance;
  if(master){
    chance = hpRatio > 0.4 ? 0.05 : (1-hpRatio)*0.85;
    if(e.hp===1) chance = 0.95;
  }else{
    chance = 0.25 + (1-hpRatio)*0.65;
  }
  if(Math.random() < chance){
    sfx.catchOk();
    if(master){ await bossCaught(); return; }
    B.over=true;
    const caught = {...e, hp:Math.max(e.hp, Math.round(maxHpOf(e)/2))};
    delete caught.bossMaxHp;
    G.party.push(caught);
    if(!G.dex.includes(e.id)) G.dex.push(e.id);
    setMsg(`Click! ✨ You caught <b>${SPECIES[e.id].name}</b>!`);
    await sleep(1300);
    await winWild(null, true);
  }else{
    sfx.fail();
    setMsg(master ? 'Oh no, it popped out! Make it more sleepy first!' : 'Oh no, it popped out! Hit it a little, then try again!');
    await sleep(1100);
    await enemyTurn();
  }
};

window.runAway = async function(){
  if(busy||B.over) return; busy=true; setBtns(false);
  sfx.tap();
  setMsg(B.trainer ? 'You ran away! The trainer will wait for you. 💨' : 'You ran away! 💨');
  await sleep(900);
  B.over=true; busy=false;
  save();
  renderTown();
};

/* ===== exp / level ups (shared) ===== */
async function grantExp(defeated, isTrainerMon){
  const my = activeMon();
  const gained = defeated.lv*(isTrainerMon?8:5) + 5;
  my.exp += gained;
  setMsg(`${SPECIES[my.id].name} got ⭐${gained} stars!`);
  await sleep(1100);
  while(my.exp >= expNeed(my)){
    my.exp -= expNeed(my);
    my.lv++;
    my.hp = Math.min(maxHpOf(my), my.hp + 8);
    sfx.good();
    setMsg(`🎉 Level up! ${SPECIES[my.id].name} is Level ${my.lv} now!`);
    await sleep(1100);
  }
}
function findEvolution(){
  const m = G.party.find(m => SPECIES[m.id].evolveLv && m.lv >= SPECIES[m.id].evolveLv);
  return m ? {mon:m, from:m.id, to:SPECIES[m.id].evolveTo} : null;
}
/* evolution chain → then town */
function finishBattle(msg){
  save();
  const evo = findEvolution();
  if(evo){ renderEvolution(evo, msg); return; }
  renderTown(msg);
}

/* ===== wild battle victory ===== */
async function winWild(msg, wasCatch){
  B.over=true;
  const e = B.enemy;
  if(msg){ sfx.good(); setMsg(msg); await sleep(1000); }
  await grantExp(e, false);
  if(!wasCatch && Math.random()<0.4){
    G.balls++;
    setMsg('You found a Poké Ball on the ground! 🔴 +1');
    await sleep(900);
  }
  busy=false;
  finishBattle(wasCatch ? `You made a new friend! You know ${G.dex.length}/${TOTAL_KINDS} kinds now! 📖` : 'You did it! 🎉');
}

/* ===== trainer battle: next mon or victory ===== */
async function trainerMonDown(){
  const e = B.enemy;
  sfx.good();
  setMsg(`${SPECIES[e.id].name} fell down!`);
  await sleep(900);
  await grantExp(e, true);
  if(B.queue.length){
    B.enemy = B.queue.shift();
    sfx.fail();
    renderBattle(`${B.trainer.avatar} ${B.trainer.trainer} sends out <b>${SPECIES[B.enemy.id].name}</b>!`);
    busy=false; setBtns(true);
    return;
  }
  // whole team beaten!
  B.over=true; busy=false;
  if(B.cave && !G.badges.includes(B.cave.badge)){
    G.badges.push(B.cave.badge);
    sfx.fanfare();
    setMsg(`🏅 You beat ${B.trainer.trainer}! You got the ${B.cave.name} badge! ${G.badges.length}/5`);
    await sleep(1500);
    finishBattle(`${B.trainer.trainer}: "Wow, you're strong! Come back anytime for a rematch!"`);
    return;
  }
  sfx.fanfare();
  finishBattle(B.legend
    ? `You beat the Champion again! What a team! 🏆`
    : `You beat ${B.trainer.trainer} again! Great practice! 💪`);
}

/* ============ EVOLUTION ============ */
function renderEvolution(evo, nextMsg){
  const fromS = SPECIES[evo.from], toS = SPECIES[evo.to];
  app.innerHTML = `
  <div class="card fadein center">
    <h2>Huh...? ${fromS.name} looks funny...!</h2>
    <div class="evo-stage flashit" id="evo-sprite">${spriteImg(evo.from,130)}</div>
    <div class="msgbox center" id="evo-msg" style="justify-content:center;"><span>✨ It's glowing! ✨</span></div>
    <div style="margin-top:14px;"><button class="big yellow" id="evo-btn" disabled>...</button></div>
  </div>`;
  setTimeout(()=>{
    const sp = document.getElementById('evo-sprite');
    const mg = document.getElementById('evo-msg');
    const bt = document.getElementById('evo-btn');
    if(!sp) return;
    // apply evolution — fully healed, feels great
    evo.mon.id = evo.to;
    evo.mon.hp = maxHpOf(evo.mon);
    if(!G.dex.includes(evo.to)) G.dex.push(evo.to);
    save();
    sfx.fanfare();
    sp.innerHTML = spriteImg(evo.to,130);
    sp.classList.remove('flashit');
    sp.classList.add('bounce');
    mg.innerHTML = `<span>🎊 WOW! <b>${fromS.name}</b> became <b>${toS.name}</b>!</span>`;
    bt.disabled = false;
    bt.textContent = 'Yay! 🎉';
    bt.onclick = ()=>{ sfx.tap(); finishBattle(nextMsg || `${toS.name} is super strong now!`); };
  }, 1700);
}

/* ============ BOSS CAUGHT ============ */
async function bossCaught(){
  B.over=true; busy=false;
  BGM.stop();
  G.bossCaught = true;
  if(!G.dex.includes('mewtwoX')) G.dex.push('mewtwoX');
  if(G.party.length<6){
    const m = newMon('mewtwoX', 24); m.hp = maxHpOf(m);
    G.party.push(m);
  }
  save();
  sfx.fanfare();
  confetti();
  app.innerHTML = `
  <div class="card fadein center">
    <div class="mon-big"><span class="bounce">${spriteImg('mewtwoX',130)}</span></div>
    <h1>🏆 YOU WIN! 🏆</h1>
    <p class="sub" style="font-size:16px;">You beat the Champion and caught <b>Mega Mewtwo X</b>!<br>
    ${G.party.some(m=>m.id==='mewtwoX') ? 'Now it\'s your friend! 💜' : 'It\'s in your book now! 📖'}</p>
    <div class="card" style="background:var(--soft); margin:10px 0;">
      <b>Your Adventure</b><br>
      🏅 Badges: ${G.badges.length}/5 &nbsp;·&nbsp; 📖 Kinds: ${G.dex.length}/${TOTAL_KINDS}<br>
      🎒 Friends: ${G.party.length} &nbsp;·&nbsp; ⭐ Best Level: ${Math.max(...G.party.map(m=>m.lv))}<br>
      <small>Can you catch all ${TOTAL_KINDS} kinds? Trainers love rematches!</small>
    </div>
    <div class="stack">
      <button class="big green" onclick="backTown()">🌿 Keep Exploring</button>
      <button class="big" onclick="fullReset()">🔄 Start Over</button>
    </div>
  </div>`;
}
window.fullReset = function(){
  if(!confirm('Really start over?')) return;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  G=null; renderTitle();
};
function confetti(){
  const emo = ['🎉','⭐','💜','✨','🎊','🔴'];
  for(let i=0;i<28;i++){
    const s = document.createElement('span');
    s.className='confetti';
    s.textContent = emo[rand(emo.length)];
    s.style.left = rand(100)+'vw';
    s.style.animationDuration = (2+Math.random()*2)+'s';
    s.style.animationDelay = (Math.random()*1.5)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 6000);
  }
}

renderTitle();
</script>
